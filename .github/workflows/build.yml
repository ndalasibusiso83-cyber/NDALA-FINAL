          cat > app/src/main/java/com/safeguard/onehub/BrowserActivity.java <<'J4'
          package com.safeguard.onehub; import android.app.Activity; import android.content.SharedPreferences; import android.os.Bundle; import android.webkit.WebView; import android.webkit.WebViewClient; import android.webkit.WebResourceRequest;
          public class BrowserActivity extends Activity {
            WebView wv; SharedPreferences prefs; String[] blocked={"pornhub","xvideos","xnxx","porn","sex","xxx","adult","onlyfans","brazzers","redtube","youporn"};
            protected void onCreate(Bundle b){
              super.onCreate(b); setContentView(R.layout.activity_browser);
              prefs=getSharedPreferences("safeguard",MODE_PRIVATE);
              wv=findViewById(R.id.webview);
              wv.getSettings().setJavaScriptEnabled(true);
              wv.getSettings().setDomStorageEnabled(true);
              wv.getSettings().setAllowFileAccess(true);
              wv.getSettings().setJavaScriptCanOpenWindowsAutomatically(true);
              wv.setWebViewClient(new WebViewClient(){
                public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request){
                  String url=request.getUrl().toString().toLowerCase();
                  for(String bad:blocked){ if(url.contains(bad)){ showBlocked(url); return true; } }
                  if(url.contains("google.com/search")){ String q=url; for(String bad:blocked){ if(q.contains(bad)){ showBlocked(q); return true; } } }
                  return false;
                }
                public void onPageStarted(WebView view, String url, android.graphics.Bitmap fav){
                  String l=url.toLowerCase();
                  for(String bad:blocked){ if(l.contains(bad)){ showBlocked(url); break; } }
                }
              });
              String test=getIntent().getStringExtra("test");
              if(test!=null) wv.loadUrl(test); else wv.loadUrl("https://www.google.com");
              findViewById(R.id.btnBack).setOnClickListener(v->{ if(wv.canGoBack()) wv.goBack(); else finish(); });
              findViewById(R.id.btnHome).setOnClickListener(v->finish());
            }
            void showBlocked(String url){
              int c=prefs.getInt("blocked_count",0)+1;
              prefs.edit().putInt("blocked_count",c).apply();
              String hist=prefs.getString("history","");
              if(hist.contains("No blocked")) hist="";
              String entry="26 Sept 15:44 - BLOCKED BY NDALA SAFEGUARD\n- Site Unauthorised: "+url+"\n\n";
              prefs.edit().putString("history",entry+hist).apply();
              String html="<html><head><meta name='viewport' content='width=device-width, initial-scale=1'></head><body style='font-family:sans-serif;text-align:center;padding:20px;background:#FFFFFF;'><div style='border:3px solid #E53935;border-radius:16px;padding:24px;margin:10px;'><h1 style='color:#E53935;font-size:24px;'>🚫 BLOCKED BY NDALA SAFEGUARD</h1><h2 style='color:#000000;'>SITE UNAUTHORISED</h2><p style='color:#555;'>This content is not allowed on NDALA family system</p><div style='background:#F5F5F5;border-radius:8px;padding:10px;margin:12px 0;'><p style='font-size:11px;color:#888;'>Founder & Developer : NDALA Safeguard<br>Sibusiso D Ndala</p><p style='font-size:10px;word-break:break-all;color:#999;'>"+url+"</p></div><br><button onclick='history.back()' style='background:#0F3D2E;color:white;padding:14px 28px;border:none;border-radius:8px;margin:5px;font-weight:bold;'>← Go Back Safe</button><button onclick='window.location.href=\"https://www.google.com\"' style='background:#4CAF50;color:white;padding:14px 28px;border:none;border-radius:8px;margin:5px;font-weight:bold;'>Go Back Home Safe</button></div></body></html>";
              wv.loadDataWithBaseURL(null,html,"text/html","UTF-8",null);
            }
            public void onBackPressed(){ if(wv.canGoBack()) wv.goBack(); else super.onBackPressed(); }
          }
          J4

