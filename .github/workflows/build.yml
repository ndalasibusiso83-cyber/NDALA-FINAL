          EOF

          cat > app/src/main/res/layout/activity_pin.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#0F3D2E" android:orientation="vertical" android:padding="24dp" android:gravity="center_horizontal"><TextView android:layout_width="50dp" android:layout_height="50dp" android:text="🔒" android:textSize="28sp" android:gravity="center" android:background="#FFFFFF" android:layout_marginTop="40dp"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Parent PIN Required" android:textColor="#FFFFFF" android:textSize="18sp" android:textStyle="bold" android:layout_marginTop="16dp"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Kids cannot see this" android:textColor="#A8D5BA" android:textSize="11sp" android:layout_marginBottom="20dp"/><EditText android:id="@+id/pinInput" android:layout_width="match_parent" android:layout_height="48dp" android:background="#FFFFFF" android:hint="Enter PIN ••••" android:gravity="center" android:inputType="numberPassword" android:textColor="#000000"/><Button android:id="@+id/btnUnlock" android:layout_width="match_parent" android:layout_height="48dp" android:text="🔓 Unlock Dashboard" android:background="#1E8C4A" android:textColor="#FFFFFF" android:layout_marginTop="12dp"/><Button android:id="@+id/btnCancel" android:layout_width="match_parent" android:layout_height="44dp" android:text="Cancel" android:background="#1A4D3A" android:textColor="#FFFFFF" android:layout_marginTop="8dp"/></LinearLayout>
          EOF

          cat > app/src/main/res/layout/activity_dashboard.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?><ScrollView xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#0F3D2E"><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="16dp"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Parent Dashboard • SECURED ✓" android:textColor="#4CAF50" android:textSize="16sp" android:textStyle="bold" android:layout_marginTop="12dp" android:layout_marginBottom="12dp"/><Button android:layout_width="match_parent" android:layout_height="60dp" android:text="Kids Profiles - Protected" android:background="#1A4D3A" android:textColor="#FFFFFF" android:layout_marginBottom="8dp"/><Button android:layout_width="match_parent" android:layout_height="60dp" android:text="Screen Time - 3h 24m today" android:background="#1A4D3A" android:textColor="#FFFFFF" android:layout_marginBottom="8dp"/><Button android:layout_width="match_parent" android:layout_height="60dp" android:text="Content Filter - Active Safe 124 blocked" android:background="#1A4D3A" android:textColor="#FFFFFF" android:layout_marginBottom="8dp"/><Button android:layout_width="match_parent" android:layout_height="60dp" android:text="Location - Home Safe" android:background="#1A4D3A" android:textColor="#FFFFFF" android:layout_marginBottom="8dp"/><Button android:layout_width="match_parent" android:layout_height="60dp" android:text="Reports - Weekly Dr Mpho" android:background="#1A4D3A" android:textColor="#FFFFFF" android:layout_marginBottom="8dp"/><Button android:layout_width="match_parent" android:layout_height="60dp" android:text="App Controls &amp; Limits" android:background="#1A4D3A" android:textColor="#FFFFFF" android:layout_marginBottom="12dp"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="🔑 Create Your Own PIN (Hidden from kids)" android:textColor="#4CAF50" android:textSize="13sp" android:textStyle="bold" android:layout_marginTop="8dp" android:layout_marginBottom="8dp"/><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:background="#1A4D3A" android:orientation="vertical" android:padding="12dp"><EditText android:id="@+id/newPinInput" android:layout_width="match_parent" android:layout_height="48dp" android:background="#FFFFFF" android:hint="Enter NEW PIN" android:gravity="center" android:inputType="numberPassword" android:textColor="#000000"/><Button android:id="@+id/btnSavePin" android:layout_width="match_parent" android:layout_height="44dp" android:text="Save New PIN" android:background="#1E8C4A" android:textColor="#FFFFFF" android:layout_marginTop="8dp"/><TextView android:id="@+id/txtPinStatus" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Current PIN: •••• hidden" android:textColor="#A8D5BA" android:textSize="11sp" android:layout_marginTop="6dp"/></LinearLayout><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="👀 What Kids Were On / Tried Accessing" android:textColor="#FF6B6B" android:textSize="13sp" android:textStyle="bold" android:layout_marginTop="16dp" android:layout_marginBottom="8dp"/><TextView android:id="@+id/txtHistory" android:layout_width="match_parent" android:layout_height="wrap_content" android:background="#1A4D3A" android:padding="12dp" android:textColor="#FFFFFF" android:textSize="11sp" android:text="No blocked attempts yet - All safe ✓"/><Button android:id="@+id/btnClear" android:layout_width="match_parent" android:layout_height="44dp" android:text="Clear History" android:background="#333333" android:textColor="#FFFFFF" android:layout_marginTop="8dp"/><Button android:id="@+id/btnLock" android:layout_width="match_parent" android:layout_height="50dp" android:text="Lock Dashboard" android:background="#1E8C4A" android:textColor="#FFFFFF" android:layout_marginTop="16dp" android:layout_marginBottom="20dp"/></LinearLayout></ScrollView>
          EOF

          cat > app/src/main/res/layout/activity_browser.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:background="#FFFFFF"><LinearLayout android:layout_width="match_parent" android:layout_height="50dp" android:background="#0F3D2E" android:gravity="center_vertical" android:orientation="horizontal" android:padding="8dp"><Button android:id="@+id/btnBack" android:layout_width="60dp" android:layout_height="36dp" android:text="‹ Back" android:background="#1E8C4A" android:textColor="#FFFFFF"/><TextView android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content" android:text="SafeGuard Safe Search" android:textColor="#FFFFFF" android:gravity="center" android:textStyle="bold"/><Button android:id="@+id/btnHome" android:layout_width="60dp" android:layout_height="36dp" android:text="Home" android:background="#FFFFFF" android:textColor="#0F3D2E"/></LinearLayout><WebView android:id="@+id/webview" android:layout_width="match_parent" android:layout_height="match_parent"/></LinearLayout>
          EOF

          cat > app/src/main/java/com/safeguard/onehub/MainActivity.java <<'EOF'
          package com.safeguard.onehub; import android.app.Activity; import android.content.Intent; import android.os.Bundle;
          public class MainActivity extends Activity {
            protected void onCreate(Bundle b){
              super.onCreate(b); setContentView(R.layout.activity_main);
              findViewById(R.id.btnSearch).setOnClickListener(v->startActivity(new Intent(this,BrowserActivity.class)));
              findViewById(R.id.btnTestBlock).setOnClickListener(v->{ Intent i=new Intent(this,BrowserActivity.class); i.putExtra("test","https://www.google.com/search?q=pornhub"); startActivity(i); });
              findViewById(R.id.btnParentDash).setOnClickListener(v->startActivity(new Intent(this,PinActivity.class)));
            }
          }
          EOF
          cat > app/src/main/java/com/safeguard/onehub/PinActivity.java <<'EOF'
          package com.safeguard.onehub; import android.app.Activity; import android.content.Intent; import android.content.SharedPreferences; import android.os.Bundle; import android.widget.EditText; import android.widget.Toast;
          public class PinActivity extends Activity {
            SharedPreferences prefs;
            protected void onCreate(Bundle b){
              super.onCreate(b); setContentView(R.layout.activity_pin);
              prefs=getSharedPreferences("safeguard",MODE_PRIVATE);
              EditText pin=findViewById(R.id.pinInput);
              findViewById(R.id.btnUnlock).setOnClickListener(v->{
                String saved=prefs.getString("parent_pin","1234");
                if(pin.getText().toString().equals(saved)){ startActivity(new Intent(this,DashboardActivity.class)); finish(); } else { Toast.makeText(this,"Wrong PIN! First time use 1234",Toast.LENGTH_SHORT).show(); }
              });
              findViewById(R.id.btnCancel).setOnClickListener(v->finish());
            }
          }
          EOF
          cat > app/src/main/java/com/safeguard/onehub/DashboardActivity.java <<'EOF'
          package com.safeguard.onehub; import android.app.Activity; import android.content.Intent; import android.content.SharedPreferences; import android.os.Bundle; import android.widget.EditText; import android.widget.TextView; import android.widget.Toast;
          public class DashboardActivity extends Activity {
            protected void onCreate(Bundle b){
              super.onCreate(b); setContentView(R.layout.activity_dashboard);
              SharedPreferences prefs=getSharedPreferences("safeguard",MODE_PRIVATE);
              TextView history=findViewById(R.id.txtHistory);
              TextView status=findViewById(R.id.txtPinStatus);
              EditText newPin=findViewById(R.id.newPinInput);
              history.setText(prefs.getString("history","No blocked attempts yet - All safe ✓"));
              status.setText("Current PIN: •••• hidden from kids");
              findViewById(R.id.btnSavePin).setOnClickListener(v->{
                String np=newPin.getText().toString();
                if(np.length()>=4){ prefs.edit().putString("parent_pin",np).apply(); Toast.makeText(this,"New PIN Saved Hidden!",Toast.LENGTH_LONG).show(); newPin.setText(""); status.setText("New PIN: •••• saved"); }
                else { Toast.makeText(this,"Enter 4 digits",Toast.LENGTH_SHORT).show(); }
              });
              findViewById(R.id.btnClear).setOnClickListener(v->{ prefs.edit().putString("history","No blocked attempts yet - All safe ✓").apply(); history.setText("No blocked attempts yet - All safe ✓"); });
              findViewById(R.id.btnLock).setOnClickListener(v->{ startActivity(new Intent(this,MainActivity.class)); finish(); });
            }
          }
          EOF
          cat > app/src/main/java/com/safeguard/onehub/BrowserActivity.java <<'EOF'
          package com.safeguard.onehub; import android.app.Activity; import android.content.SharedPreferences; import android.os.Bundle; import android.webkit.WebResourceRequest; import android.webkit.WebView; import android.webkit.WebViewClient;
          public class BrowserActivity extends Activity {
            WebView wv; SharedPreferences prefs; String[] blocked={"pornhub","xvideos","xnxx","porn","xxx","onlyfans"};
            protected void onCreate(Bundle b){
              super.onCreate(b); setContentView(R.layout.activity_browser);
              prefs=getSharedPreferences("safeguard",MODE_PRIVATE);
              wv=findViewById(R.id.webview); wv.getSettings().setJavaScriptEnabled(true);
              wv.setWebViewClient(new WebViewClient(){
                public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest r){ String u=r.getUrl().toString().toLowerCase(); for(String s:blocked){ if(u.contains(s)){ block(u); return true; } } return false; }
                public void onPageFinished(WebView view, String url){ String l=url.toLowerCase(); for(String s:blocked){ if(l.contains(s)){ block(url); break; } } }
              });
              String t=getIntent().getStringExtra("test"); if(t!=null) wv.loadUrl(t); else wv.loadUrl("https://www.google.com");
              findViewById(R.id.btnBack).setOnClickListener(v->finish()); findViewById(R.id.btnHome).setOnClickListener(v->finish());
            }
            void block(String url){
              String h=prefs.getString("history","No blocked attempts yet - All safe ✓"); if(h.contains("No blocked")) h="";
              String entry="🚫 "+java.time.LocalTime.now().withNano(0)+" - Tried: "+url+"\n";
              prefs.edit().putString("history",entry+h).apply();
              String html="<html><body style='font-family:sans-serif;text-align:center;padding:20px;background:#0F3D2E;color:white;'><div style='background:#1A4D3A;border-radius:16px;padding:20px;'><h2 style='color:#FF6B6B;'>🚫 BLOCKED BY NDALA SAFEGUARD</h2><p>Site blocked - Kids safety</p><p style='font-size:10px;word-break:break-all;color:#A8D5BA;'>"+url+"</p><br><button onclick='history.back()' style='background:#1E8C4A;color:white;padding:12px 24px;border:none;border-radius:8px;'>← Go Back Safe</button></div></body></html>";
              wv.loadData(html,"text/html","UTF-8");
            }
            public void onBackPressed(){ if(wv.canGoBack()) wv.goBack(); else super.onBackPressed(); }
          }
          EOF

      - uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.5
          arguments: :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SafeGuard-FINAL-v92
          path: app/build/outputs/apk/debug/*.apk
