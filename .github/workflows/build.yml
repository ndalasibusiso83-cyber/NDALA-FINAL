          cat > app/src/main/java/com/safeguard/onehub/MainActivity.java <<'EOF'
          package com.safeguard.onehub; import android.app.Activity; import android.content.Intent; import android.os.Bundle;
          public class MainActivity extends Activity { protected void onCreate(Bundle b){ super.onCreate(b); setContentView(R.layout.activity_main); findViewById(R.id.btnSearch).setOnClickListener(v->startActivity(new Intent(this, BrowserActivity.class))); findViewById(R.id.btnTestBlock).setOnClickListener(v->{ Intent i=new Intent(this, BrowserActivity.class); i.putExtra("url","https://www.google.com/search?q=pornhub"); startActivity(i); }); findViewById(R.id.btnParentDash).setOnClickListener(v->startActivity(new Intent(this, PinActivity.class))); } }
          EOF
          cat > app/src/main/java/com/safeguard/onehub/PinActivity.java <<'EOF'
          package com.safeguard.onehub; import android.app.Activity; import android.content.Intent; import android.content.SharedPreferences; import android.os.Bundle; import android.widget.EditText; import android.widget.Toast;
          public class PinActivity extends Activity { protected void onCreate(Bundle b){ super.onCreate(b); setContentView(R.layout.activity_pin); SharedPreferences p=getSharedPreferences("safeguard",0); EditText pin=findViewById(R.id.pinInput); findViewById(R.id.btnUnlock).setOnClickListener(v->{ if(pin.getText().toString().equals(p.getString("parent_pin","1234"))){ startActivity(new Intent(this, DashboardActivity.class)); finish(); } else Toast.makeText(this,"Wrong PIN 1234",0).show(); }); findViewById(R.id.btnCancel).setOnClickListener(v->finish()); } }
          EOF
          cat > app/src/main/java/com/safeguard/onehub/DashboardActivity.java <<'EOF'
          package com.safeguard.onehub; import android.app.Activity; import android.content.Intent; import android.content.SharedPreferences; import android.os.Bundle; import android.widget.EditText; import android.widget.TextView; import android.widget.Toast;
          public class DashboardActivity extends Activity { protected void onCreate(Bundle b){ super.onCreate(b); setContentView(R.layout.activity_dashboard); SharedPreferences p=getSharedPreferences("safeguard",0); TextView h=findViewById(R.id.txtHistory); EditText n=findViewById(R.id.newPinInput); h.setText(p.getString("history","No history")); findViewById(R.id.btnSavePin).setOnClickListener(v->{ String np=n.getText().toString(); if(np.length()>=4){ p.edit().putString("parent_pin",np).apply(); Toast.makeText(this,"Saved",1).show(); n.setText(""); } }); findViewById(R.id.btnClear).setOnClickListener(v->{ p.edit().putString("history","No history").apply(); h.setText("No history"); }); findViewById(R.id.btnLock).setOnClickListener(v->{ startActivity(new Intent(this, MainActivity.class)); finish(); }); } }
          EOF
          cat > app/src/main/java/com/safeguard/onehub/BrowserActivity.java <<'EOF'
          package com.safeguard.onehub; import android.app.Activity; import android.content.SharedPreferences; import android.os.Bundle; import android.webkit.WebView; import android.webkit.WebViewClient;
          public class BrowserActivity extends Activity {
            WebView wv; SharedPreferences prefs;
            protected void onCreate(Bundle b){
              super.onCreate(b); setContentView(R.layout.activity_browser);
              prefs=getSharedPreferences("safeguard",0);
              wv=findViewById(R.id.webview);
              wv.getSettings().setJavaScriptEnabled(true);
              wv.setWebViewClient(new WebViewClient(){
                public boolean shouldOverrideUrlLoading(WebView v, String url){
                  String l=url.toLowerCase();
                  if(l.contains("porn")||l.contains("xxx")||l.contains("onlyfans")||l.contains("lolita")||l.contains("underage")){
                    String old=prefs.getString("history",""); prefs.edit().putString("history","BLOCKED: "+url+"\n"+old).apply();
                    v.loadData("<html><body style='text-align:center;padding:20px;'><h1 style='color:red;'>BLOCKED BY NDALA</h1><p>"+url+"</p><button onclick='window.location.href=\"https://www.google.com\"'>Home</button></body></html>","text/html","UTF-8"); return true;
                  }
                  return false;
                }
              });
              String u=getIntent().getStringExtra("url"); if(u!=null) wv.loadUrl(u); else wv.loadUrl("https://www.google.com");
            }
          }
          EOF

      - uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.5
          arguments: :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SafeGuard-114-FIXED-GREEN-ONLY-LAYOUT
          path: app/build/outputs/apk/debug/*.apk
