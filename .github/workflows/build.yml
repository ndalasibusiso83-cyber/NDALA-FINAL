name: Build SafeGuard GUARANTEED OPEN 98
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: BUILD STABLE
        run: |
          rm -rf app/src .gradle app/build || true
          mkdir -p app/src/main/java/com/safeguard/onehub
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'SET'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "SafeGuard-STABLE98"; include ':app'
          SET
          echo "plugins { id 'com.android.application' version '8.2.2' apply false }" > build.gradle
          printf "org.gradle.jvmargs=-Xmx2048m\nandroid.useAndroidX=true\n" > gradle.properties

          cat > app/build.gradle <<'APP'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.safeguard.onehub'
              compileSdk 34
              defaultConfig {
                  applicationId "com.safeguard.onehub"
                  minSdk 24
                  targetSdk 34
                  versionCode 98
                  versionName "9.8-STABLE-OPEN"
              }
          }
          dependencies {}
          APP

          cat > app/src/main/res/values/strings.xml <<'STR'
          <resources><string name="app_name">SafeGuard One Hub</string></resources>
          STR

          cat > app/src/main/AndroidManifest.xml <<'MAN'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="SafeGuard One Hub" android:theme="@android:style/Theme.Black.NoTitleBar">
              <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
              <activity android:name=".BrowserActivity" android:exported="false"/>
              <activity android:name=".PinActivity" android:exported="false"/>
              <activity android:name=".DashboardActivity" android:exported="false"/>
            </application>
          </manifest>
          MAN

          cat > app/src/main/res/layout/activity_main.xml <<'L1'
          <?xml version="1.0" encoding="utf-8"?><ScrollView xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#FFFFFF"><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="16dp" android:gravity="center_horizontal"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="🛡️" android:textSize="40sp" android:layout_marginTop="10dp"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="SafeGuard One Hub" android:textColor="#0F3D2E" android:textSize="22sp" android:textStyle="bold" android:layout_marginTop="8dp"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Parental control &amp; safety dashboard" android:textColor="#888888" android:textSize="12sp" android:layout_marginBottom="20dp"/><LinearLayout android:id="@+id/btnSearch" android:layout_width="match_parent" android:layout_height="50dp" android:background="#F0F0F0" android:gravity="center_vertical" android:padding="12dp" android:layout_marginBottom="12dp"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="🔍  Safe Google Search" android:textColor="#555555"/></LinearLayout><LinearLayout android:layout_width="match_parent" android:layout_height="60dp" android:background="#FFFFFF" android:gravity="center_vertical" android:padding="12dp" android:layout_marginBottom="10dp"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="🔒 VPN Shield ON - Protected" android:textColor="#000000" android:textStyle="bold"/></LinearLayout><LinearLayout android:layout_width="match_parent" android:layout_height="60dp" android:background="#FFFFFF" android:gravity="center_vertical" android:padding="12dp" android:layout_marginBottom="10dp"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="🔍 Media Scanner ON - Safe" android:textColor="#000000" android:textStyle="bold"/></LinearLayout><TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Family ID - NDALA" android:textColor="#000000" android:textStyle="bold" android:textSize="16sp" android:layout_marginTop="10dp" android:layout_marginBottom="10dp"/><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal"><Button android:id="@+id/btnTestBlock" android:layout_width="0dp" android:layout_weight="1" android:layout_height="50dp" android:text="TEST BLOCK" android:background="#FFFFFF" android:textColor="#0F3D2E"/><Button android:id="@+id/btnParentDash" android:layout_width="0dp" android:layout_weight="1" android:layout_height="50dp" android:text="Parent Dashboard" android:background="#0F3D2E" android:textColor="#FFFFFF" android:layout_marginLeft="8dp"/></LinearLayout><TextView android:layout_width="match_parent" android:layout_height="60dp" android:text="Created by Sibusiso D Ndala" android:textColor="#FFFFFF" android:background="#0F3D2E" android:gravity="center" android:layout_marginTop="20dp"/></LinearLayout></ScrollView>
          L1
          cat > app/src/main/res/layout/activity_pin.xml <<'L3'
          <?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#0F3D2E" android:orientation="vertical" android:padding="24dp" android:gravity="center"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Parent PIN Required" android:textColor="#FFFFFF" android:textSize="18sp" android:textStyle="bold"/><EditText android:id="@+id/pinInput" android:layout_width="match_parent" android:layout_height="48dp" android:background="#FFFFFF" android:hint="Enter PIN ••••" android:gravity="center" android:inputType="numberPassword" android:layout_marginTop="20dp"/><Button android:id="@+id/btnUnlock" android:layout_width="match_parent" android:layout_height="48dp" android:text="Unlock" android:background="#1E8C4A" android:textColor="#FFFFFF" android:layout_marginTop="12dp"/><Button android:id="@+id/btnCancel" android:layout_width="match_parent" android:layout_height="44dp" android:text="Cancel" android:background="#333333" android:textColor="#FFFFFF" android:layout_marginTop="8dp"/></LinearLayout>
          L3
          cat > app/src/main/res/layout/activity_dashboard.xml <<'L4'
          <?xml version="1.0" encoding="utf-8"?><ScrollView xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#0F3D2E"><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="16dp"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Parent Dashboard SECURED" android:textColor="#4CAF50" android:textSize="16sp" android:textStyle="bold" android:layout_marginBottom="12dp"/><Button android:layout_width="match_parent" android:layout_height="50dp" android:text="Kids Profiles - Protected" android:background="#1A4D3A" android:textColor="#FFFFFF" android:layout_marginBottom="8dp"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Create Your Own PIN (Hidden)" android:textColor="#4CAF50" android:textSize="13sp" android:textStyle="bold" android:layout_marginTop="12dp"/><EditText android:id="@+id/newPinInput" android:layout_width="match_parent" android:layout_height="48dp" android:background="#FFFFFF" android:hint="Enter NEW PIN" android:gravity="center" android:inputType="numberPassword" android:layout_marginTop="8dp"/><Button android:id="@+id/btnSavePin" android:layout_width="match_parent" android:layout_height="44dp" android:text="Save New PIN" android:background="#1E8C4A" android:textColor="#FFFFFF" android:layout_marginTop="8dp"/><TextView android:id="@+id/txtPinStatus" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Current PIN hidden" android:textColor="#A8D5BA" android:textSize="11sp" android:layout_marginTop="6dp"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="What Kids Tried Accessing" android:textColor="#FF6B6B" android:textSize="13sp" android:textStyle="bold" android:layout_marginTop="16dp" android:layout_marginBottom="8dp"/><TextView android:id="@+id/txtHistory" android:layout_width="match_parent" android:layout_height="wrap_content" android:background="#1A4D3A" android:padding="12dp" android:textColor="#FFFFFF" android:textSize="11sp" android:text="No blocked yet"/><Button android:id="@+id/btnClear" android:layout_width="match_parent" android:layout_height="44dp" android:text="Clear History" android:background="#333333" android:textColor="#FFFFFF" android:layout_marginTop="8dp"/><Button android:id="@+id/btnLock" android:layout_width="match_parent" android:layout_height="50dp" android:text="Lock Dashboard" android:background="#1E8C4A" android:textColor="#FFFFFF" android:layout_marginTop="16dp"/></LinearLayout></ScrollView>
          L4
          cat > app/src/main/res/layout/activity_browser.xml <<'L2'
          <?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical"><LinearLayout android:layout_width="match_parent" android:layout_height="50dp" android:background="#0F3D2E" android:gravity="center_vertical" android:padding="8dp"><Button android:id="@+id/btnBack" android:layout_width="70dp" android:layout_height="40dp" android:text="Back" android:background="#1E8C4A" android:textColor="#FFFFFF"/><TextView android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content" android:text="Safe Search" android:textColor="#FFFFFF" android:gravity="center" android:textStyle="bold"/><Button android:id="@+id/btnHome" android:layout_width="70dp" android:layout_height="40dp" android:text="Home" android:background="#FFFFFF" android:textColor="#0F3D2E"/></LinearLayout><WebView android:id="@+id/webview" android:layout_width="match_parent" android:layout_height="match_parent"/></LinearLayout>
          L2

          cat > app/src/main/java/com/safeguard/onehub/MainActivity.java <<'J1'
          package com.safeguard.onehub; import android.app.Activity; import android.content.Intent; import android.os.Bundle;
          public class MainActivity extends Activity {
            protected void onCreate(Bundle b){ super.onCreate(b); setContentView(R.layout.activity_main);
              findViewById(R.id.btnSearch).setOnClickListener(v->startActivity(new Intent(this, BrowserActivity.class)));
              findViewById(R.id.btnTestBlock).setOnClickListener(v->{ Intent i=new Intent(this, BrowserActivity.class); i.putExtra("test","https://www.google.com/search?q=pornhub"); startActivity(i); });
              findViewById(R.id.btnParentDash).setOnClickListener(v->startActivity(new Intent(this, PinActivity.class)));
            }
          }
          J1
          cat > app/src/main/java/com/safeguard/onehub/PinActivity.java <<'J2'
          package com.safeguard.onehub; import android.app.Activity; import android.content.Intent; import android.content.SharedPreferences; import android.os.Bundle; import android.widget.EditText; import android.widget.Toast;
          public class PinActivity extends Activity {
            protected void onCreate(Bundle b){ super.onCreate(b); setContentView(R.layout.activity_pin);
              SharedPreferences p=getSharedPreferences("safeguard",0);
              EditText pin=findViewById(R.id.pinInput);
              findViewById(R.id.btnUnlock).setOnClickListener(v->{ String s=p.getString("parent_pin","1234"); if(pin.getText().toString().equals(s)){ startActivity(new Intent(this, DashboardActivity.class)); finish(); } else Toast.makeText(this,"Wrong PIN first 1234",0).show(); });
              findViewById(R.id.btnCancel).setOnClickListener(v->finish());
            }
          }
          J2
          cat > app/src/main/java/com/safeguard/onehub/DashboardActivity.java <<'J3'
          package com.safeguard.onehub; import android.app.Activity; import android.content.Intent; import android.content.SharedPreferences; import android.os.Bundle; import android.widget.EditText; import android.widget.TextView; import android.widget.Toast;
          public class DashboardActivity extends Activity {
            protected void onCreate(Bundle b){ super.onCreate(b); setContentView(R.layout.activity_dashboard);
              SharedPreferences p=getSharedPreferences("safeguard",0);
              TextView h=findViewById(R.id.txtHistory); TextView s=findViewById(R.id.txtPinStatus); EditText n=findViewById(R.id.newPinInput);
              h.setText(p.getString("history","No blocked yet"));
              findViewById(R.id.btnSavePin).setOnClickListener(v->{ String np=n.getText().toString(); if(np.length()>=4){ p.edit().putString("parent_pin",np).apply(); Toast.makeText(this,"Saved!",1).show(); n.setText(""); s.setText("PIN saved hidden"); } });
              findViewById(R.id.btnClear).setOnClickListener(v->{ p.edit().putString("history","No blocked yet").apply(); h.setText("No blocked yet"); });
              findViewById(R.id.btnLock).setOnClickListener(v->{ startActivity(new Intent(this, MainActivity.class)); finish(); });
            }
          }
          J3
          cat > app/src/main/java/com/safeguard/onehub/BrowserActivity.java <<'J4'
          package com.safeguard.onehub; import android.app.Activity; import android.content.SharedPreferences; import android.os.Bundle; import android.webkit.WebView; import android.webkit.WebViewClient;
          public class BrowserActivity extends Activity {
            WebView wv; SharedPreferences prefs;
            protected void onCreate(Bundle b){
              super.onCreate(b); setContentView(R.layout.activity_browser);
              prefs=getSharedPreferences("safeguard",0);
              wv=findViewById(R.id.webview);
              wv.getSettings().setJavaScriptEnabled(true);
              wv.getSettings().setDomStorageEnabled(true);
              wv.setWebViewClient(new WebViewClient(){
                public boolean shouldOverrideUrlLoading(WebView view, String url){
                  String l=url.toLowerCase();
                  if(l.contains("porn")||l.contains("xxx")||l.contains("xvideo")||l.contains("onlyfans")){ block(url); return true; }
                  return false;
                }
              });
              String t=getIntent().getStringExtra("test");
              if(t!=null) wv.loadUrl(t); else wv.loadUrl("https://www.google.com");
              findViewById(R.id.btnBack).setOnClickListener(v->finish());
              findViewById(R.id.btnHome).setOnClickListener(v->finish());
            }
            void block(String url){
              String old=prefs.getString("history","");
              prefs.edit().putString("history","BLOCKED: "+url+"\n"+old).apply();
              String html="<html><body style='text-align:center;padding:20px;'><h1 style='color:red;'>BLOCKED BY NDALA SAFEGUARD</h1><h2>SITE UNAUTHORISED</h2><p>"+url+" blocked</p><button onclick='history.back()'>Go Back Safe</button> <button onclick='window.location.href=\"https://www.google.com\"'>Home Safe</button><p>Founder Sibusiso D Ndala</p></body></html>";
              wv.loadData(html,"text/html","UTF-8");
            }
          }
          J4

      - uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.5
          arguments: :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SafeGuard-STABLE-OPEN-v98
          path: app/build/outputs/apk/debug/*.apk
