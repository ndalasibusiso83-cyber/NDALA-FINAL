            <LinearLayout android:layout_width="match_parent" android:layout_height="60dp" android:background="@drawable/card_bg" android:gravity="center_vertical" android:padding="12dp" android:layout_marginBottom="10dp" android:orientation="horizontal"><TextView android:layout_width="40dp" android:layout_height="40dp" android:text="🔒" android:gravity="center" android:textSize="20sp" android:background="#FFF3E0"/><LinearLayout android:layout_width="0dp" android:layout_weight="1" android:orientation="vertical" android:layout_marginLeft="10dp"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="VPN Shield" android:textColor="#000000" android:textStyle="bold" android:textSize="13sp"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Secure connection active • Protected" android:textColor="#4CAF50" android:textSize="10sp"/></LinearLayout><TextView android:layout_width="45dp" android:layout_height="24dp" android:text="ON" android:gravity="center" android:background="@drawable/btn_green" android:textColor="#FFFFFF" android:textSize="11sp"/></LinearLayout>
            <LinearLayout android:layout_width="match_parent" android:layout_height="60dp" android:background="@drawable/card_bg" android:gravity="center_vertical" android:padding="12dp" android:layout_marginBottom="14dp" android:orientation="horizontal"><TextView android:layout_width="40dp" android:layout_height="40dp" android:text="🔍" android:gravity="center" android:textSize="20sp" android:background="#E3F2FD"/><LinearLayout android:layout_width="0dp" android:layout_weight="1" android:orientation="vertical" android:layout_marginLeft="10dp"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Media Scanner" android:textColor="#000000" android:textStyle="bold" android:textSize="13sp"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Scanning photos &amp; messages • Safe" android:textColor="#4CAF50" android:textSize="10sp"/></LinearLayout><TextView android:layout_width="45dp" android:layout_height="24dp" android:text="ON" android:gravity="center" android:background="@drawable/btn_green" android:textColor="#FFFFFF" android:textSize="11sp"/></LinearLayout>
            <TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Family ID" android:textColor="#000000" android:textStyle="bold" android:textSize="14sp" android:layout_marginBottom="6dp"/>
            <LinearLayout android:layout_width="match_parent" android:layout_height="60dp" android:background="@drawable/card_bg" android:gravity="center_vertical" android:padding="12dp" android:layout_marginBottom="10dp" android:orientation="horizontal"><LinearLayout android:layout_width="0dp" android:layout_weight="1" android:orientation="vertical"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="NDALA" android:textColor="#000000" android:textStyle="bold" android:textSize="16sp"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Family ID • Share with family devices" android:textColor="#888888" android:textSize="10sp"/></LinearLayout><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="📋" android:textSize="20sp"/></LinearLayout>
            <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal"><Button android:id="@+id/btnTestBlock" android:layout_width="0dp" android:layout_weight="1" android:layout_height="44dp" android:text="TEST BLOCK" android:background="@drawable/btn_outline" android:textColor="#0F3D2E" android:layout_marginRight="6dp"/><Button android:id="@+id/btnParentDash" android:layout_width="0dp" android:layout_weight="1" android:layout_height="44dp" android:text="Parent Dashboard" android:background="@drawable/btn_green" android:textColor="#FFFFFF" android:layout_marginLeft="6dp"/></LinearLayout>
            <LinearLayout android:layout_width="match_parent" android:layout_height="70dp" android:background="@drawable/btn_green" android:gravity="center" android:orientation="vertical" android:layout_marginTop="16dp"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Created by" android:textColor="#A8D5BA" android:textSize="10sp"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Sibusiso D Ndala" android:textColor="#FFFFFF" android:textStyle="bold" android:textSize="14sp"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Founder &amp; Developer - NDALA Safeguard" android:textColor="#A8D5BA" android:textSize="9sp"/></LinearLayout>
          </LinearLayout>
