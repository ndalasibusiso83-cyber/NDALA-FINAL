name: Build SafeGuard APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: BUILD SAFEGUARD ONE HUB - SECURE NO 1234
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SAFEGUARD-ONE-HUB"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          printf "org.gradle.jvmargs=-Xmx2048m\nandroid.useAndroidX=true\n" > gradle.properties

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.safeguard.onehub'
              compileSdk 34
              defaultConfig {
                  applicationId "com.safeguard.onehub"
                  minSdk 24
                  targetSdk 34
                  versionCode 6
                  versionName "6.0-SECURE"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          rm -rf app/src/main/res app/src/main/java/com
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/java/com/safeguard/onehub

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="dark_green">#0F3D2E</color>
              <color name="light_green">#1E8C4A</color>
              <color name="gold">#FFC107</color>
              <color name="white">#FFFFFF</color>
              <color name="gray_text">#A8D5BA</color>
          </resources>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">SafeGuard One Hub</string>
          </resources>
          EOF

          cat > app/src/main/res/drawable/bg_input.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#FFFFFF"/>
              <corners android:radius="16dp"/>
          </shape>
          EOF

          cat > app/src/main/res/drawable/btn_unlock.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#1E8C4A"/>
              <corners android:radius="16dp"/>
          </shape>
          EOF

          cat > app/src/main/res/drawable/btn_cancel.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#0F3D2E"/>
              <corners android:radius="16dp"/>
              <stroke android:width="2dp" android:color="#FFFFFF"/>
          </shape>
          EOF

          cat > app/src/main/res/drawable/lock_bg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#FFC107"/>
              <corners android:radius="20dp"/>
          </shape>
          EOF

          cat > app/src/main/res/drawable/dot_empty.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#0F3D2E"/>
              <stroke android:width="2dp" android:color="#3A6B5A"/>
              <size android:width="16dp" android:height="16dp"/>
          </shape>
          EOF

          cat > app/src/main/res/drawable/dot_filled.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#FFC107"/>
              <size android:width="16dp" android:height="16dp"/>
          </shape>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0F3D2E"
              android:orientation="vertical"
              android:padding="24dp"
              android:gravity="center_horizontal">

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="SafeGuard One Hub"
                  android:textColor="#FFFFFF"
                  android:textSize="20sp"
                  android:textStyle="bold"
                  android:layout_marginTop="40dp"
                  android:layout_marginBottom="60dp"/>

              <LinearLayout
                  android:layout_width="80dp"
                  android:layout_height="80dp"
                  android:background="@drawable/lock_bg"
                  android:gravity="center"
                  android:layout_marginBottom="24dp">
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="🔒" android:textSize="36sp"/>
              </LinearLayout>

              <TextView android:id="@+id/titleText"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Parent PIN Required"
                  android:textColor="#FFFFFF"
                  android:textSize="26sp"
                  android:textStyle="bold"
                  android:gravity="center"/>

              <TextView android:id="@+id/subtitleText"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Kids cannot access dashboard"
                  android:textColor="#A8D5BA"
                  android:textSize="14sp"
                  android:layout_marginTop="12dp"
                  android:layout_marginBottom="32dp"
                  android:gravity="center"/>

              <LinearLayout
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:layout_marginBottom="24dp">
                  <View android:id="@+id/dot1" android:layout_width="16dp" android:layout_height="16dp" android:background="@drawable/dot_empty" android:layout_margin="8dp"/>
                  <View android:id="@+id/dot2" android:layout_width="16dp" android:layout_height="16dp" android:background="@drawable/dot_empty" android:layout_margin="8dp"/>
                  <View android:id="@+id/dot3" android:layout_width="16dp" android:layout_height="16dp" android:background="@drawable/dot_empty" android:layout_margin="8dp"/>
                  <View android:id="@+id/dot4" android:layout_width="16dp" android:layout_height="16dp" android:background="@drawable/dot_empty" android:layout_margin="8dp"/>
              </LinearLayout>

              <TextView android:id="@+id/hintText"
                  android:layout_width="match_parent"
                  android:layout_height="60dp"
                  android:background="@drawable/bg_input"
                  android:text="Enter PIN ••••"
                  android:textColor="#999999"
                  android:textSize="18sp"
                  android:gravity="center"
                  android:layout_marginBottom="20dp"/>

              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:gravity="center">
                  <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:orientation="horizontal">
                      <Button android:id="@+id/btn1" android:layout_width="80dp" android:layout_height="80dp" android:layout_margin="6dp" android:text="1" android:textSize="24sp" android:textColor="#FFFFFF" android:background="@drawable/btn_cancel"/>
                      <Button android:id="@+id/btn2" android:layout_width="80dp" android:layout_height="80dp" android:layout_margin="6dp" android:text="2" android:textSize="24sp" android:textColor="#FFFFFF" android:background="@drawable/btn_cancel"/>
                      <Button android:id="@+id/btn3" android:layout_width="80dp" android:layout_height="80dp" android:layout_margin="6dp" android:text="3" android:textSize="24sp" android:textColor="#FFFFFF" android:background="@drawable/btn_cancel"/>
                  </LinearLayout>
                  <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:orientation="horizontal">
                      <Button android:id="@+id/btn4" android:layout_width="80dp" android:layout_height="80dp" android:layout_margin="6dp" android:text="4" android:textSize="24sp" android:textColor="#FFFFFF" android:background="@drawable/btn_cancel"/>
                      <Button android:id="@+id/btn5" android:layout_width="80dp" android:layout_height="80dp" android:layout_margin="6dp" android:text="5" android:textSize="24sp" android:textColor="#FFFFFF" android:background="@drawable/btn_cancel"/>
                      <Button android:id="@+id/btn6" android:layout_width="80dp" android:layout_height="80dp" android:layout_margin="6dp" android:text="6" android:textSize="24sp" android:textColor="#FFFFFF" android:background="@drawable/btn_cancel"/>
                  </LinearLayout>
                  <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:orientation="horizontal">
                      <Button android:id="@+id/btn7" android:layout_width="80dp" android:layout_height="80dp" android:layout_margin="6dp" android:text="7" android:textSize="24sp" android:textColor="#FFFFFF" android:background="@drawable/btn_cancel"/>
                      <Button android:id="@+id/btn8" android:layout_width="80dp" android:layout_height="80dp" android:layout_margin="6dp" android:text="8" android:textSize="24sp" android:textColor="#FFFFFF" android:background="@drawable/btn_cancel"/>
                      <Button android:id="@+id/btn9" android:layout_width="80dp" android:layout_height="80dp" android:layout_margin="6dp" android:text="9" android:textSize="24sp" android:textColor="#FFFFFF" android:background="@drawable/btn_cancel"/>
                  </LinearLayout>
                  <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:orientation="horizontal">
                      <View android:layout_width="80dp" android:layout_height="80dp" android:layout_margin="6dp"/>
                      <Button android:id="@+id/btn0" android:layout_width="80dp" android:layout_height="80dp" android:layout_margin="6dp" android:text="0" android:textSize="24sp" android:textColor="#FFFFFF" android:background="@drawable/btn_cancel"/>
                      <Button android:id="@+id/btnDel" android:layout_width="80dp" android:layout_height="80dp" android:layout_margin="6dp" android:text="⌫" android:textSize="20sp" android:textColor="#FFFFFF" android:background="@drawable/btn_cancel"/>
                  </LinearLayout>
              </LinearLayout>

              <Button android:id="@+id/btnUnlock"
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:layout_marginTop="24dp"
                  android:background="@drawable/btn_unlock"
                  android:text="🔒 Unlock Dashboard"
                  android:textColor="#FFFFFF"
                  android:textStyle="bold"/>

              <Button android:id="@+id/btnCancel"
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:layout_marginTop="12dp"
                  android:background="@drawable/btn_cancel"
                  android:text="Cancel"
                  android:textColor="#FFFFFF"
                  android:textStyle="bold"/>

              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="🛡️ Protected • Secure Access" android:textColor="#5A8A6F" android:textSize="11sp" android:layout_marginTop="24dp"/>
          </LinearLayout>
          EOF

          cat > app/src/main/res/layout/activity_dashboard.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0F3D2E"
              android:orientation="vertical"
              android:padding="24dp">
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="SafeGuard One Hub" android:textColor="#FFFFFF" android:textSize="20sp" android:textStyle="bold" android:layout_marginTop="40dp"/>
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Parent Dashboard - SECURED" android:textColor="#A8D5BA" android:textSize="14sp" android:layout_marginTop="8dp"/>
              <Button android:id="@+id/btnChangePin" android:layout_width="match_parent" android:layout_height="56dp" android:text="Change PIN 🔑" android:background="@drawable/btn_unlock" android:textColor="#FFFFFF" android:layout_marginTop="40dp"/>
              <Button android:id="@+id/btnLock" android:layout_width="match_parent" android:layout_height="56dp" android:text="Lock Dashboard 🔒" android:background="@drawable/btn_cancel" android:textColor="#FFFFFF" android:layout_marginTop="12dp"/>
          </LinearLayout>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="SafeGuard One Hub" android:theme="@android:style/Theme.Black.NoTitleBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <activity android:name=".DashboardActivity" android:exported="false"/>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/safeguard/onehub/MainActivity.java <<'EOF'
          package com.safeguard.onehub;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.Button;
          import android.widget.TextView;
          import android.widget.Toast;
          public class MainActivity extends Activity {
              private StringBuilder pin = new StringBuilder();
              private StringBuilder firstPin = new StringBuilder();
              private View dot1, dot2, dot3, dot4;
              private TextView title, subtitle, hint;
              private boolean isCreating = false, isConfirming = false;
              private SharedPreferences prefs;
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  setContentView(R.layout.activity_main);
                  prefs = getSharedPreferences("safeguard_secure", MODE_PRIVATE);
                  dot1 = findViewById(R.id.dot1); dot2 = findViewById(R.id.dot2); dot3 = findViewById(R.id.dot3); dot4 = findViewById(R.id.dot4);
                  title = findViewById(R.id.titleText); subtitle = findViewById(R.id.subtitleText); hint = findViewById(R.id.hintText);
                  String savedPin = prefs.getString("parent_pin", null);
                  if (savedPin == null) {
                      isCreating = true;
                      title.setText("Create Parent PIN");
                      subtitle.setText("Set a secret PIN only parents know");
                      hint.setText("Create PIN ••••");
                  } else {
                      title.setText("Parent PIN Required");
                      subtitle.setText("Kids cannot access dashboard");
                      hint.setText("Enter PIN ••••");
                  }
                  int[] btnIds = {R.id.btn0,R.id.btn1,R.id.btn2,R.id.btn3,R.id.btn4,R.id.btn5,R.id.btn6,R.id.btn7,R.id.btn8,R.id.btn9};
                  for (int id : btnIds) {
                      findViewById(id).setOnClickListener(v -> {
                          if (pin.length() < 4) {
                              pin.append(((Button) v).getText().toString());
                              updateDots();
                              if (pin.length() == 4) handlePin();
                          }
                      });
                  }
                  findViewById(R.id.btnDel).setOnClickListener(v -> { if (pin.length() > 0) { pin.deleteCharAt(pin.length()-1); updateDots(); } });
                  findViewById(R.id.btnUnlock).setOnClickListener(v -> { if (pin.length() == 4) handlePin(); else Toast.makeText(this, "Enter 4 digits", Toast.LENGTH_SHORT).show(); });
                  findViewById(R.id.btnCancel).setOnClickListener(v -> finish());
              }
              private void updateDots() {
                  View[] dots = {dot1, dot2, dot3, dot4};
                  for (int i = 0; i < 4; i++) dots[i].setBackgroundResource(i < pin.length()? R.drawable.dot_filled : R.drawable.dot_empty);
                  if (pin.length() == 0) hint.setText(isCreating? "Create PIN ••••" : "Enter PIN ••••");
                  else {
                      StringBuilder sb = new StringBuilder();
                      for (int i = 0; i < pin.length(); i++) sb.append("•");
                      for (int i = pin.length(); i < 4; i++) sb.append("○");
                      hint.setText("PIN: " + sb.toString());
                  }
              }
              private void handlePin() {
                  String savedPin = prefs.getString("parent_pin", null);
                  if (isCreating &&!isConfirming) {
                      firstPin = new StringBuilder(pin.toString());
                      pin.setLength(0); updateDots();
                      isConfirming = true;
                      title.setText("Confirm Your PIN");
                      subtitle.setText("Enter same PIN again");
                      hint.setText("Confirm PIN ••••");
                      Toast.makeText(this, "Confirm your PIN", Toast.LENGTH_SHORT).show();
                  } else if (isCreating && isConfirming) {
                      if (pin.toString().equals(firstPin.toString())) {
                          prefs.edit().putString("parent_pin", pin.toString()).apply();
                          Toast.makeText(this, "PIN Saved! ✓", Toast.LENGTH_SHORT).show();
                          startActivity(new Intent(this, DashboardActivity.class)); finish();
                      } else {
                          Toast.makeText(this, "PINs don't match!", Toast.LENGTH_SHORT).show();
                          pin.setLength(0); firstPin.setLength(0); isConfirming = false;
                          title.setText("Create Parent PIN"); subtitle.setText("Set a secret PIN only parents know");
                          updateDots();
                      }
                  } else {
                      if (pin.toString().equals(savedPin)) {
                          startActivity(new Intent(this, DashboardActivity.class)); finish();
                      } else {
                          Toast.makeText(this, "Wrong PIN!", Toast.LENGTH_SHORT).show();
                          pin.setLength(0); updateDots();
                      }
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/safeguard/onehub/DashboardActivity.java <<'EOF'
          package com.safeguard.onehub;
          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          public class DashboardActivity extends Activity {
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  setContentView(R.layout.activity_dashboard);
                  findViewById(R.id.btnLock).setOnClickListener(v -> { startActivity(new Intent(this, MainActivity.class)); finish(); });
                  findViewById(R.id.btnChangePin).setOnClickListener(v -> {
                      getSharedPreferences("safeguard_secure", MODE_PRIVATE).edit().remove("parent_pin").apply();
                      startActivity(new Intent(this, MainActivity.class)); finish();
                  });
              }
          }
          EOF

      - name: Build APK
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.5
          arguments: :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeGuard-One-Hub-SECURE-NO-1234
          path: app/build/outputs/apk/debug/*.apk
