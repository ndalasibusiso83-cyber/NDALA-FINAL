name: Build NDALA APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: BUILD NDALA - PARENT SET PIN - NO DEFAULT FIXED
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NDALA-FINAL"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          printf "org.gradle.jvmargs=-Xmx2048m\nandroid.useAndroidX=true\n" > gradle.properties

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.ndala.secure'
              compileSdk 34
              defaultConfig {
                  applicationId "com.ndala.secure"
                  minSdk 24
                  targetSdk 34
                  versionCode 4
                  versionName "4.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          rm -rf app/src/main/res app/src/main/java/com
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/java/com/ndala/secure

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="black">#000000</color>
              <color name="white">#FFFFFF</color>
              <color name="gold">#FFC107</color>
              <color name="gray">#333333</color>
              <color name="dark_gray">#1A1A1A</color>
          </resources>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">NDALA SECURE</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="PinButton">
                  <item name="android:layout_width">88dp</item>
                  <item name="android:layout_height">88dp</item>
                  <item name="android:layout_margin">8dp</item>
                  <item name="android:background">@drawable/btn_circle</item>
                  <item name="android:textColor">#FFFFFF</item>
                  <item name="android:textSize">28sp</item>
                  <item name="android:textStyle">bold</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/btn_circle.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_pressed="true">
                  <shape android:shape="oval"><solid android:color="#FFC107"/></shape>
              </item>
              <item>
                  <shape android:shape="oval"><solid android:color="#1A1A1A"/><stroke android:width="1dp" android:color="#333333"/></shape>
              </item>
          </selector>
          EOF

          cat > app/src/main/res/drawable/dot_empty.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#000000"/>
              <stroke android:width="2dp" android:color="#333333"/>
              <size android:width="20dp" android:height="20dp"/>
          </shape>
          EOF

          cat > app/src/main/res/drawable/dot_filled.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#FFC107"/>
              <size android:width="20dp" android:height="20dp"/>
          </shape>
          EOF

          cat > app/src/main/res/drawable/card_bg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#1A1A1A"/>
              <corners android:radius="16dp"/>
              <stroke android:width="1dp" android:color="#333333"/>
          </shape>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000"
              android:orientation="vertical"
              android:gravity="center_horizontal"
              android:padding="24dp">
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="NDALA SECURE" android:textColor="#FFC107" android:textSize="28sp" android:textStyle="bold" android:layout_marginTop="60dp"/>
              <TextView android:id="@+id/titleText" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Enter Your PIN" android:textColor="#FFFFFF" android:textSize="16sp" android:layout_marginTop="12dp" android:alpha="0.7"/>
              <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:orientation="horizontal" android:layout_marginTop="40dp" android:layout_marginBottom="50dp">
                  <View android:id="@+id/dot1" android:layout_width="20dp" android:layout_height="20dp" android:background="@drawable/dot_empty" android:layout_margin="12dp"/>
                  <View android:id="@+id/dot2" android:layout_width="20dp" android:layout_height="20dp" android:background="@drawable/dot_empty" android:layout_margin="12dp"/>
                  <View android:id="@+id/dot3" android:layout_width="20dp" android:layout_height="20dp" android:background="@drawable/dot_empty" android:layout_margin="12dp"/>
                  <View android:id="@+id/dot4" android:layout_width="20dp" android:layout_height="20dp" android:background="@drawable/dot_empty" android:layout_margin="12dp"/>
              </LinearLayout>
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:gravity="center">
                  <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:orientation="horizontal">
                      <Button android:id="@+id/btn1" style="@style/PinButton" android:text="1"/>
                      <Button android:id="@+id/btn2" style="@style/PinButton" android:text="2"/>
                      <Button android:id="@+id/btn3" style="@style/PinButton" android:text="3"/>
                  </LinearLayout>
                  <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:orientation="horizontal">
                      <Button android:id="@+id/btn4" style="@style/PinButton" android:text="4"/>
                      <Button android:id="@+id/btn5" style="@style/PinButton" android:text="5"/>
                      <Button android:id="@+id/btn6" style="@style/PinButton" android:text="6"/>
                  </LinearLayout>
                  <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:orientation="horizontal">
                      <Button android:id="@+id/btn7" style="@style/PinButton" android:text="7"/>
                      <Button android:id="@+id/btn8" style="@style/PinButton" android:text="8"/>
                      <Button android:id="@+id/btn9" style="@style/PinButton" android:text="9"/>
                  </LinearLayout>
                  <LinearLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:orientation="horizontal">
                      <View android:layout_width="88dp" android:layout_height="88dp" android:layout_margin="8dp"/>
                      <Button android:id="@+id/btn0" style="@style/PinButton" android:text="0"/>
                      <Button android:id="@+id/btnDel" style="@style/PinButton" android:text="⌫" android:textSize="22sp"/>
                  </LinearLayout>
              </LinearLayout>
              <TextView android:id="@+id/statusText" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Kids cannot access dashboard" android:textColor="#888888" android:textSize="13sp" android:layout_marginTop="30dp" android:gravity="center"/>
          </LinearLayout>
          EOF

          cat > app/src/main/res/layout/activity_vault.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000"
              android:orientation="vertical"
              android:padding="24dp">
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="PARENT DASHBOARD" android:textColor="#FFC107" android:textSize="24sp" android:textStyle="bold" android:layout_marginTop="40dp"/>
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="✓ SECURED - Only parents can see this" android:textColor="#4CAF50" android:textSize="13sp" android:layout_marginTop="8dp"/>
              <LinearLayout android:layout_width="match_parent" android:layout_height="90dp" android:background="@drawable/card_bg" android:orientation="horizontal" android:gravity="center_vertical" android:padding="16dp" android:layout_marginTop="32dp">
                  <TextView android:layout_width="50dp" android:layout_height="50dp" android:text="👨‍👩‍👧" android:textSize="28sp" android:gravity="center" android:background="@drawable/btn_circle"/>
                  <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:orientation="vertical" android:layout_marginLeft="16dp">
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Safeguard Controls" android:textColor="#FFFFFF" android:textSize="16sp" android:textStyle="bold"/>
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Manage kids protection" android:textColor="#888888" android:textSize="12sp"/>
                  </LinearLayout>
              </LinearLayout>
              <Button android:id="@+id/btnChangePin" android:layout_width="match_parent" android:layout_height="56dp" android:text="Change PIN 🔑" android:textColor="#000000" android:backgroundTint="#FFC107" android:layout_marginTop="24dp" android:textStyle="bold"/>
              <Button android:id="@+id/btnLock" android:layout_width="match_parent" android:layout_height="56dp" android:text="Lock Dashboard 🔒" android:textColor="#FFFFFF" android:backgroundTint="#333333" android:layout_marginTop="12dp"/>
          </LinearLayout>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="NDALA SECURE" android:theme="@android:style/Theme.Black.NoTitleBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <activity android
