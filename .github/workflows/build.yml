          <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="16dp" android:gravity="center_horizontal">
            <TextView android:layout_width="50dp" android:layout_height="50dp" android:text="🛡️" android:textSize="32sp" android:gravity="center" android:background="@drawable/card_bg" android:layout_marginTop="10dp"/>
            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="SafeGuard One Hub" android:textColor="#0F3D2E" android:textSize="20sp" android:textStyle="bold" android:layout_marginTop="8dp"/>
