          cat > app/src/main/java/com/safeguard/onehub/BrowserActivity.java <<'EOF'
          package com.safeguard.onehub;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebResourceRequest;
          public class BrowserActivity extends Activity {
            WebView w;
            protected void onCreate(Bundle b){
              super.onCreate(b);
              w=new WebView(this); setContentView(w);
              w.getSettings().setJavaScriptEnabled(true);
              w.getSettings().setDomStorageEnabled(true);
              String url=getIntent().getStringExtra("url"); if(url==null) url="https://www.google.com";
