          EOF
          cat > app/src/main/java/com/safeguard/onehub/BrowserActivity.java <<'EOF'
          package com.safeguard.onehub;
          import android.app.Activity; import android.os.Bundle; import android.webkit.WebView; import android.webkit.WebViewClient; import android.graphics.Bitmap; import android.content.SharedPreferences; import java.text.SimpleDateFormat; import java.util.Date;
          public class BrowserActivity extends Activity {
            WebView w;
            String BLOCK="<html><head><meta name='viewport' content='width=device-width, initial-scale=1'><style>body{background:#0a0a0a;color:white;font-family:sans-serif;text-align:center;margin:0;padding:20px}.box{margin-top:30px;background:#1a1a1a;border-radius:20px;padding:25px;border:2px solid #ff3b3b}h1{color:#ff3b3b;font-size:40px}button{background:#ff3b3b;color:white;border:none;padding:16px 40px;border-radius:30px;font-size:18px;font-weight:bold;margin-top:20px}</style></head><body><div class='box'><div style='font-size:60px'>🛡️</div><h1>BLOCKED</h1><h2>Adult Content</h2><p style='color:#ff9999'>Blocked before data loaded</p><p>By <b>Sibusiso D Ndala</b><br>NDALA Safeguard<br>Family NDALA • PIN 1234</p><button onclick='window.history.back()'>← Go Back Safe</button></div></body></html>";
            void log(String url){
              SharedPreferences sp=getSharedPreferences("ndala",MODE_PRIVATE);
              int c=sp.getInt("count",0)+1;
              String t=new SimpleDateFormat("dd MMM HH:mm").format(new Date());
              String old=sp.getString("history",""); if(old.startsWith("No blocked")) old="";
              String e="🚫 "+t+" - BLOCKED: "+url+"\n";
              sp.edit().putString("history",e+old).putInt("count",c).apply();
            }
            boolean bad(String url){
              if(url==null) return false; String u=url.toLowerCase();
              String[] b={"pornhub","xvideos","xnxx","xhamster","redtube","youporn","youjizz","tube8","spankbang","beeg","txxx","porn","xxx","sex","adult","erotic","nude","naked","onlyfans","brazzers","chaturbate","cam4"};
              for(String s:b) if(u.contains(s)) return true; return false;
            }
            protected void onCreate(Bundle b){
              super.onCreate(b); w=new WebView(this); setContentView(w); w.getSettings().setJavaScriptEnabled(true);
              String start=getIntent().getStringExtra("url"); if(start==null) start="https://www.google.com";
              w.setWebViewClient(new WebViewClient(){
                public void onPageStarted(WebView v, String url, Bitmap f){ if(bad(url)){ v.stopLoading(); log(url); v.loadData(BLOCK,"text/html","UTF-8"); return; } super.onPageStarted(v,url,f); }
                public boolean shouldOverrideUrlLoading(WebView v, String url){ if(bad(url)){ log(url); v.loadData(BLOCK,"text/html","UTF-8"); return true; } return false; }
              });
              if(bad(start)){ log(start); w.loadData(BLOCK,"text/html","UTF-8"); } else w.loadUrl(start);
            }
            public void onBackPressed(){ if(w.canGoBack()) w.goBack(); else super.onBackPressed(); }
          }
          EOF
          dd if=/dev/urandom of=app/src/main/assets/data.bin bs=1M count=2 2>/dev/null
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          ./gradle-8.7/bin/gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NDALA-REMOTE-v6-PIN-1234
          path: app/build/outputs/apk/debug/app-debug.apk
