                  return false;
                }
              });
              w.loadUrl(url);
            }
            public void onBackPressed(){ if(w.canGoBack()) w.goBack(); else super.onBackPressed(); }
          }
          EOF
          dd if=/dev/urandom of=app/src/main/assets/data.bin bs=1M count=3 2>/dev/null
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          ./gradle-8.7/bin/gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew app:assembleDebug
          ls -lh app/build/outputs/apk/debug/
      - uses: actions/upload-artifact@v4
        with:
          name: NDALA-SIBUSISO-FOUNDER-FINAL
          path: app/build/outputs/apk/debug/app-debug.apk
