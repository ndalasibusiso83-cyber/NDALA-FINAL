          cat > app/src/main/java/com/safeguard/onehub/BrowserActivity.java <<'EOF'
          package com.safeguard.onehub;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.graphics.Bitmap;
          import android.content.SharedPreferences;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          public class BrowserActivity extends Activity {
            WebView w;
            String BLOCK_HTML = "<html><body style='background:#0a0a0a;color:white;text-align:center;padding:20px;font-family:sans-serif'><div style='margin-top:30px;background:#1a1a1a;border-radius:20px;padding:25px;border:2px solid #ff3b3b'><div style='font-size:60px'>🛡️</div><h1 style='color:#ff3b3b'>BLOCKED</h1><h2>Adult Content</h2><p style='color:#ff9999'>Blocked before data loaded</p><p>By <b>Sibusiso D Ndala</b><br>NDALA • PIN 1234</p><button onclick='window.history.back()' style='background:#ff3b3b;color:white;border:none;padding:16px 40px;border-radius:30px;font-size:18px;font-weight:bold;margin-top:20px'>Go Back Safe</button></div></body></html>";
            void logBlocked(String url){
              SharedPreferences sp=getSharedPreferences("ndala",MODE_PRIVATE);
              int count=sp.getInt("count",0)+1;
              String time=new SimpleDateFormat("dd MMM HH:mm").format(new Date());
              String old=sp.getString("history","");
              if(old.startsWith("No blocked")) old="";
              String entry="🚫 "+time+" - BLOCKED: "+url+"\n";
              sp.edit().putString("history",entry+old).putInt("count",count).apply();
            }
            boolean isBadUrl(String url){
              if(url==null) return false;
              String u=url.toLowerCase();
              String[] bad={"pornhub","xvideos","xnxx","xhamster","redtube","youporn","youjizz","tube8","spankbang","beeg","txxx","porn","xxx","sex","adult","erotic","nude","naked","onlyfans","brazzers","chaturbate","cam4"};
              for(String s:bad){ if(u.contains(s)) return true; }
              return false;
            }
            protected void onCreate(Bundle b){
              super.onCreate(b);
              w=new WebView(this); setContentView(w);
              w.getSettings().setJavaScriptEnabled(true);
              String startUrl=getIntent().getStringExtra("url");
              if(startUrl==null) startUrl="https://www.google.com";
              w.setWebViewClient(new WebViewClient(){
                public void onPageStarted(WebView v, String url, Bitmap f){ if(isBadUrl(url)){ v.stopLoading(); logBlocked(url); v.loadData(BLOCK_HTML,"text/html","UTF-8"); return; } super.onPageStarted(v,url,f); }
                public boolean shouldOverrideUrlLoading(WebView v, String url){ if(isBadUrl(url)){ logBlocked(url); v.loadData(BLOCK_HTML,"text/html","UTF-8"); return true; } return false; }
              });
              if(isBadUrl(startUrl)){ logBlocked(startUrl); w.loadData(BLOCK_HTML,"text/html","UTF-8"); } else { w.loadUrl(startUrl); }
            }
            public void onBackPressed(){ if(w.canGoBack()) w.goBack(); else super.onBackPressed(); }
          }
          EOF
