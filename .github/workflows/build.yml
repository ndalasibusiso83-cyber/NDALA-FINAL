          package com.safeguard.onehub; import android.app.Activity; import android.content.SharedPreferences; import android.os.Bundle; import android.webkit.WebView; import android.webkit.WebViewClient;
          public class BrowserActivity extends Activity {
            WebView wv; SharedPreferences prefs;
            protected void onCreate(Bundle b){
              super.onCreate(b); setContentView(R.layout.activity_browser);
              prefs=getSharedPreferences("safeguard",0);
              wv=findViewById(R.id.webview);
              wv.getSettings().setJavaScriptEnabled(true);
              wv.getSettings().setDomStorageEnabled(true);
              wv.setWebViewClient(new WebViewClient(){
                public boolean shouldOverrideUrlLoading(WebView v, String url){
                  save(url);
                  if(blocked(url)){ block(url); return true; }
                  return false;
                }
              });
              String u=getIntent().getStringExtra("url");
              if(u!=null){ save(u); if(blocked(u)) wv.loadData(html(u),"text/html","UTF-8"); else wv.loadUrl(u); }
              else wv.loadUrl("https://www.google.com");
            }
            boolean blocked(String s){
              String l=s.toLowerCase();
              String[] b={"pornhub","xvideos","xnxx","xhamster","redtube","youporn","onlyfans","brazzers","chaturbate","cam4","beeg","spankbang","xxx","porn","sex","adult","nsfw","erotic","hentai","nude","naked","boobs","pussy","hardcore","lolita","loli","childporn","underage","jailbait","preteen","cp","teen porn","incest","rape"};
              for(String k:b) if(l.contains(k)) return true;
              return false;
            }
            void save(String url){
              if(url.contains("gen_204")||url.contains("favicon")||url.contains("complete")) return;
              String old=prefs.getString("history","");
              if(old.contains("No searches yet")) old="";
              String e="";
              try{
                if(url.contains("search?q=")){
                  String q=url.split("q=")[1].split("&")[0].replace("+"," ");
                  q=java.net.URLDecoder.decode(q,"UTF-8");
                  if(blocked(q)) e="🚫 BLOCKED: "+q+" - PORN/GRAPHIC/UNDERAGE\n";
                  else e="🔍 Searched: "+q+"\n";
                } else {
                  if(blocked(url)) e="🚫 BLOCKED: "+url+"\n";
                  else e="🌐 Visited: "+url+"\n";
                }
              } catch(Exception ex){ e="🌐 "+url+"\n"; }
              if(!old.contains(e) && e.length()>3) prefs.edit().putString("history",e+old).apply();
            }
            String html(String u){ return "<html><body style='text-align:center;padding:20px;background:#FFFFFF;'><div style='border:4px solid red;border-radius:20px;padding:20px;'><h1 style='color:red;'>🚫 BLOCKED BY NDALA SAFEGUARD</h1><h2>SITE UNAUTHORISED</h2><p style='color:red;font-weight:bold;'>PORN GRAPHIC / UNDERAGE CONTENT DETECTED</p><p style='font-size:11px;'>"+u+"</p><br><button onclick='window.location.href=\"https://www.google.com\"' style='background:#0F3D2E;color:white;padding:14px 28px;border:none;border-radius:10px;'>Go Home Safe</button><p style='font-size:9px;margin-top:12px;'>Sibusiso D Ndala - Child Safe Protection</p></div></body></html>"; }
            void block(String u){ wv.loadData(html(u),"text/html","UTF-8"); }
          }
