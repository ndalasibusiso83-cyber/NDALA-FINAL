name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build NDALA
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          rm -rf app build.gradle settings.gradle gradle gradlew*
          mkdir -p app/src/main/java/com/safeguard/onehub
          mkdir -p app/src/main/res/values
          echo 'include ":app"' > settings.gradle
          printf 'buildscript{repositories{google();mavenCentral()}dependencies{classpath "com.android.tools.build:gradle:8.2.2"}}allprojects{repositories{google();mavenCentral()}}' > build.gradle
          printf 'plugins{id "com.android.application"}\nandroid{namespace "com.safeguard.onehub"\ncompileSdk 34\ndefaultConfig{applicationId "com.safeguard.onehub"\nminSdk 24\ntargetSdk 34\nversionCode 12\nversionName "1.0"}}' > app/build.gradle
          printf '<resources><string name="app_name">NDALA Safeguard</string></resources>' > app/src/main/res/values/strings.xml
          printf '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:label="@string/app_name"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          cat > app/src/main/java/com/safeguard/onehub/MainActivity.java <<'EOF'
          package com.safeguard.onehub;
          import android.app.Activity; import android.os.Bundle; import android.webkit.WebView; import android.webkit.WebViewClient; import android.webkit.WebResourceRequest;
          public class MainActivity extends Activity {
            WebView w;
            protected void onCreate(Bundle b){
              super.onCreate(b);
              w=new WebView(this); setContentView(w);
              w.getSettings().setJavaScriptEnabled(true);
              w.setWebViewClient(new WebViewClient(){
                public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r){
                  String u=r.getUrl().toString().toLowerCase();
                  if(u.contains("pornhub")||u.contains("xvideos")||u.contains("xnxx")||u.contains("xhamster")||u.contains("redtube")||u.contains("porn")){
                    String html="<html><body style='background:#111;color:white;text-align:center;padding-top:100px;font-family:sans-serif;'><h1 style='color:#ff4444;font-size:40px;'>🛡️ BLOCKED</h1><h2>By NDALA Safeguard</h2><p>This content is protected.</p><br><button onclick='window.history.back()' style='padding:15px 30px;background:#ff4444;color:white;border:none;border-radius:10px;font-size:18px;'>Go Back Safe</button></body></html>";
                    v.loadData(html,"text/html","UTF-8"); return true;
                  } return false;
                }
              });
              w.loadUrl("https://www.google.com");
            }
          }
          EOF
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
       ./gradle-8.7/bin/gradle wrapper --gradle-version 8.7
          chmod +x gradlew
       ./gradlew app:assembleDebug
          ls -lh app/build/outputs/apk/debug/
      - uses: actions/upload-artifact@v4
        with:
          name: NDALA-APK
          path: app/build/outputs/apk/debug/app-debug.apk
