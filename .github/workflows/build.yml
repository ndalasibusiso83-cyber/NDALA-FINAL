          <?xml version="1.0" encoding="utf-8"?><ScrollView xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#0F3D2E"><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="16dp"><TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Parent Dashboard" android:textColor="#4CAF50" android:textSize="18sp" android:textStyle="bold" android:gravity="center" android:layout_marginBottom="16dp"/><EditText android:id="@+id/newPinInput" android:layout_width="match_parent" android:layout_height="48dp" android:background="#FFFFFF" android:hint="New PIN" android:gravity="center" android:inputType="numberPassword"/><Button android:id="@+id/btnSavePin" android:layout_width="match_parent" android:layout_height="44dp" android:text="Save PIN" android:background="#1E8C4A" android:textColor="#FFFFFF" android:layout_marginTop="8dp"/><TextView android:id="@+id/txtHistory" android:layout_width="match_parent" android:layout_height="wrap_content" android:background="#1A4D3A" android:padding="12dp" android:textColor="#FFFFFF" android:textSize="11sp" android:text="No history" android:layout_marginTop="16dp"/><Button android:id="@+id/btnClear" android:layout_width="match_parent" android:layout_height="44dp" android:text="Clear" android:background="#333333" android:textColor="#FFFFFF" android:layout_marginTop="8dp"/><Button android:id="@+id/btnLock" android:layout_width="match_parent" android:layout_height="50dp" android:text="Lock" android:background="#1E8C4A" android:textColor="#FFFFFF" android:layout_marginTop="16dp"/></LinearLayout></ScrollView>
