          cat > app/src/main/java/com/safeguard/onehub/BrowserActivity.java <<'J4'
          package com.safeguard.onehub; import android.app.Activity; import android.content.SharedPreferences; import android.os.Bundle; import android.webkit.WebView; import android.webkit.WebViewClient;
          public class BrowserActivity extends Activity {
            WebView wv; SharedPreferences prefs;
            protected void onCreate(Bundle b){
              super.onCreate(b); setContentView(R.layout.activity_browser);
              prefs=getSharedPreferences("safeguard",0);
              wv=findViewById(R.id.webview);
              wv.getSettings().setJavaScriptEnabled(true);
              wv.getSettings().setDomStorageEnabled(true);
              wv.setWebViewClient(new WebViewClient(){
                public boolean shouldOverrideUrlLoading(WebView view, String url){
                  String l=url.toLowerCase();
                  if(l.contains("porn")||l.contains("xxx")||l.contains("xvideo")||l.contains("xnxx")||l.contains("onlyfans")){ block(url); return true; }
                  return false;
                }
              });
              String t=getIntent().getStringExtra("test");
              if(t!=null) wv.loadUrl(t); else wv.loadUrl("https://www.google.com");
              findViewById(R.id.btnBack).setOnClickListener(v->finish());
              findViewById(R.id.btnHome).setOnClickListener(v->finish());
            }
            void block(String url){
              String old=prefs.getString("history","");
              if(old.contains("No blocked")) old="";
              prefs.edit().putString("history","🚫 Tried: "+url+"\n"+old).apply();
              String html="<html><body style='text-align:center;padding:20px;background:#0F3D2E;color:white;'><div style='background:#1A4D3A;border-radius:16px;padding:20px;'><h1 style='color:#FF6B6B;'>🚫 BLOCKED BY NDALA SAFEGUARD</h1><h2>SITE UNAUTHORISED</h2><p>This content not allowed</p><p style='font-size:10px;color:#A8D5BA;'>"+url+"</p><br><button onclick='history.back()' style='background:#1E8C4A;color:white;padding:12px 24px;border:none;border-radius:8px;'>Go Back Safe</button><button onclick='window.location.href=\"https://www.google.com\"' style='background:#FFFFFF;color:#0F3D2E;padding:12px 24px;border:none;border-radius:8px;margin-left:8px;'>Home Safe</button><p style='font-size:9px;margin-top:12px;'>Founder Sibusiso D Ndala - NDALA Safeguard</p></div></body></html>";
              wv.loadData(html,"text/html","UTF-8");
            }
          }
