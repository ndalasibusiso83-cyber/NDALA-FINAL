name: v94 FINAL ORIGINAL No Crash
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: BUILD v94 FINAL ORIGINAL
        run: |
          rm -rf app/src .gradle app/build || true
          mkdir -p app/src/main/java/com/safeguard/onehub app/src/main/res/layout app/src/main/res/values app/src/main/res/drawable
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "SafeGuard"; include ':app'
          EOF
          echo "plugins { id 'com.android.application' version '8.2.2' apply false }" > build.gradle
          echo -e "org.gradle.jvmargs=-Xmx2048m\nandroid.useAndroidX=true" > gradle.properties
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'com.safeguard.onehub'; compileSdk 34; defaultConfig { applicationId "com.safeguard.onehub"; minSdk 24; targetSdk 34; versionCode 94; versionName "FINAL ORIGINAL" } }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">SafeGuard</string></resources>
          EOF
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources><style name="Theme.SafeGuard" parent="Theme.AppCompat.Light.NoActionBar"><item name="colorPrimary">#0F3D2E</item></style></resources>
          EOF
          echo '<shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#FFFFFF"/><corners android:radius="16dp"/><stroke android:width="1dp" android:color="#E0E0E0"/></shape>' > app/src/main/res/drawable/card.xml
          echo '<shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#0F3D2E"/><corners android:radius="12dp"/></shape>' > app/src/main/res/drawable/green.xml
          echo '<shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#FFFFFF"/><corners android:radius="12dp"/><stroke android:width="1.5dp" android:color="#0F3D2E"/></shape>' > app/src/main/res/drawable/border.xml
          echo '<shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#1E8C4A"/><corners android:radius="12dp"/></shape>' > app/src/main/res/drawable/on.xml
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:label="SafeGuard" android:theme="@style/Theme.SafeGuard"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity><activity android:name=".BrowserActivity" android:exported="false"/><activity android:name=".PinActivity" android:exported="false"/><activity android:name=".DashboardActivity" android:exported="false"/></application></manifest>
          EOF
          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?><ScrollView xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#F5F5F0"><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="16dp" android:gravity="center_horizontal"><TextView android:layout_width="50dp" android:layout_height="50dp" android:text="🛡️" android:textSize="32sp" android:gravity="center" android:background="@drawable/card" android:layout_marginTop="10dp"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="SafeGuard One Hub" android:textColor="#0F3D2E" android:textSize="20sp" android:textStyle="bold" android:layout_marginTop="8dp"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Parental control &amp; safety dashboard" android:textColor="#666666" android:textSize="12sp" android:layout_marginBottom="16dp"/><LinearLayout android:id="@+id/btnSearch" android:layout_width="match_parent" android:layout_height="48dp" android:background="@drawable/card" android:gravity="center_vertical" android:padding="12dp" android:layout_marginBottom="12dp"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="🔍 Safe Google Search" android:textColor="#888888" android:textSize="14sp"/></LinearLayout><LinearLayout android:layout_width="match_parent" android:layout_height="60dp" android:background="@drawable/card" android:gravity="center_vertical" android:padding="12dp" android:layout_marginBottom="10dp" android:orientation="horizontal"><TextView android:layout_width="40dp" android:layout_height="40dp" android:text="🔒" android:gravity="center" android:textSize="20sp"/><LinearLayout android:layout_width="0dp" android:layout_weight="1" android:orientation="vertical" android:layout_marginLeft="10dp"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="VPN Shield" android:textColor="#000000" android:textStyle="bold" android:textSize="13sp"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Secure connection active • Protected" android:textColor="#4CAF50" android:textSize="10sp"/></LinearLayout><TextView android:layout_width="45dp" android:layout_height="24dp" android:text="ON" android:gravity="center" android:background="@drawable/on" android:textColor="#FFFFFF" android:textSize="11sp"/></LinearLayout><LinearLayout android:layout_width="match_parent" android:layout_height="60dp" android:background="@drawable/card" android:gravity="center_vertical" android:padding="12dp" android:layout_marginBottom="14dp" android:orientation="horizontal"><TextView android:layout_width="40dp" android:layout_height="40dp" android:text="🔍" android:gravity="center" android:textSize="20sp"/><LinearLayout android:layout_width="0dp" android:layout_weight="1" android:orientation="vertical" android:layout_marginLeft="10dp"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Media Scanner" android:textColor="#000000" android:textStyle="bold" android:textSize="13sp"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Scanning photos &amp; messages • Safe" android:textColor="#4CAF50" android:textSize="10sp"/></LinearLayout><TextView android:layout_width="45dp" android:layout_height="24dp" android:text="ON" android:gravity="center" android:background="@drawable/on" android:textColor="#FFFFFF" android:textSize="11sp"/></LinearLayout><TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Family ID" android:textColor="#000000" android:textStyle="bold" android:textSize="14sp" android:layout_marginBottom="6dp"/><LinearLayout android:layout_width="match_parent" android:layout_height="60dp" android:background="@drawable/card" android:gravity="center_vertical" android:padding="12dp" android:layout_marginBottom="10dp" android:orientation="horizontal"><LinearLayout android:layout_width="0dp" android:layout_weight="1" android:orientation="vertical"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="NDALA" android:textColor="#000000" android:textStyle="bold" android:textSize="16sp"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Family ID • Share with family devices" android:textColor="#888888" android:textSize="10sp"/></LinearLayout><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="📋" android:textSize="20sp"/></LinearLayout><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal"><TextView android:id="@+id/btnTestBlock" android:layout_width="0dp" android:layout_weight="1" android:layout_height="44dp" android:text="TEST BLOCK" android:gravity="center" android:background="@drawable/border" android:textColor="#0F3D2E" android:layout_marginRight="6dp" android:textStyle="bold"/><TextView android:id="@+id/btnParentDash" android:layout_width="0dp" android:layout_weight="1" android:layout_height="44dp" android:text="Parent Dashboard" android:gravity="center" android:background="@drawable/green" android:textColor="#FFFFFF" android:layout_marginLeft="6dp" android:textStyle="bold"/></LinearLayout><LinearLayout android:layout_width="match_parent" android:layout_height="70dp" android:background="@drawable/green" android:gravity="center" android:orientation="vertical" android:layout_marginTop="16dp"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Created by" android:textColor="#A8D5BA" android:textSize="10sp"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Sibusiso D Ndala" android:textColor="#FFFFFF" android:textStyle="bold" android:textSize="14sp"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Founder &amp; Developer - NDALA Safeguard" android:textColor="#A8D5BA" android:textSize="9sp"/></LinearLayout></LinearLayout></ScrollView>
          EOF
          cat > app/src/main/res/layout/activity_browser.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:background="#FFFFFF"><LinearLayout android:layout_width="match_parent" android:layout_height="50dp" android:background="#0F3D2E" android:gravity="center_vertical" android:orientation="horizontal" android:padding="8dp"><Button android:id="@+id/btnBack" android:layout_width="60dp" android:layout_height="36dp" android:text="‹ Back" android:background="#1E8C4A" android:textColor="#FFFFFF"/><TextView android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content" android:text="SafeGuard" android:textColor="#FFFFFF" android:gravity="center" android:textStyle="bold"/><Button android:id="@+id/btnHome" android:layout_width="60dp" android:layout_height="36dp" android:text="Home" android:background="#FFFFFF" android:textColor="#0F3D2E"/></LinearLayout><WebView android:id="@+id/webview" android:layout_width="match_parent" android:layout_height="match_parent"/></LinearLayout>
          EOF
          cat > app/src/main/res/layout/activity_pin.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#0F3D2E" android:orientation="vertical" android:padding="24dp" android:gravity="center_horizontal"><TextView android:layout_width="50dp" android:layout_height="50dp" android:text="🔒" android:textSize="28sp" android:gravity="center" android:background="#FFFFFF" android:layout_marginTop="40dp"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Parent PIN Required" android:textColor="#FFFFFF" android:textSize="18sp" android:textStyle="bold" android:layout_marginTop="16dp"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Kids cannot see this" android:textColor="#A8D5BA" android:textSize="11sp" android:layout_marginBottom="20dp"/><EditText android:id="@+id/pinInput" android:layout_width="match_parent" android:layout_height="48dp" android:background="#FFFFFF" android:hint="Enter PIN" android:gravity="center" android:inputType="numberPassword" android:textColor="#000000"/><Button android:id="@+id/btnUnlock" android:layout_width="match_parent" android:layout_height="48dp" android:text="Unlock" android:background="#1E8C4A" android:textColor="#FFFFFF" android:layout_marginTop="12dp"/><Button android:id="@+id/btnCancel" android:layout_width="match_parent" android:layout_height="44dp" android:text="Cancel" android:background="#1A4D3A" android:textColor="#FFFFFF" android:layout_marginTop="8dp"/></LinearLayout>
          EOF
          cat > app/src/main/res/layout/activity_dashboard.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?><ScrollView xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#0F3D2E"><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="16dp"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Parent Dashboard • SECURED ✓" android:textColor="#4CAF50" android:textSize="16sp" android:textStyle="bold" android:layout_marginTop="12dp" android:layout_marginBottom="12dp"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Create Your Own PIN" android:textColor="#4CAF50" android:textSize="13sp" android:textStyle="bold" android:layout_marginBottom="8dp"/><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:background="#1A4D3A" android:orientation="vertical" android:padding="12dp"><EditText android:id="@+id/newPinInput" android:layout_width="match_parent" android:layout_height="48dp" android:background="#FFFFFF" android:hint="New PIN" android:gravity="center" android:inputType="numberPassword"/><Button android:id="@+id/btnSavePin" android:layout_width="match_parent" android:layout_height="44dp" android:text="Save New PIN" android:background="#1E8C4A" android:textColor="#FFFFFF" android:layout_marginTop="8dp"/><TextView android:id="@+id/txtPinStatus" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Current: hidden" android:textColor="#A8D5BA" android:textSize="11sp" android:layout_marginTop="6dp"/></LinearLayout><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="What Kids Tried" android:textColor="#FF6B6B" android:textSize="13sp" android:textStyle="bold" android:layout_marginTop="16dp" android:layout_marginBottom="8dp"/><TextView android:id="@+id/txtHistory" android:layout_width="match_parent" android:layout_height="wrap_content" android:background="#1A4D3A" android:padding="12dp" android:textColor="#FFFFFF" android:textSize="11sp" android:text="No blocked attempts yet"/><Button android:id="@+id/btnClear" android:layout_width="match_parent" android:layout_height="44dp" android:text="Clear" android:background="#333333" android:textColor="#FFFFFF" android:layout_marginTop="8dp"/><Button android:id="@+id/btnLock" android:layout_width="match_parent" android:layout_height="50dp" android:text="Lock" android:background="#1E8C4A" android:textColor="#FFFFFF" android:layout_marginTop="16dp"/></LinearLayout></ScrollView>
          EOF
          cat > app/src/main/java/com/safeguard/onehub/MainActivity.java <<'EOF'
          package com.safeguard.onehub; import androidx.appcompat.app.AppCompatActivity; import android.content.Intent; import android.os.Bundle; public class MainActivity extends AppCompatActivity { protected void onCreate(Bundle b){ super.onCreate(b); setContentView(R.layout.activity_main); findViewById(R.id.btnSearch).setOnClickListener(v->startActivity(new Intent(this,BrowserActivity.class))); findViewById(R.id.btnTestBlock).setOnClickListener(v->{ Intent i=new Intent(this,BrowserActivity.class); i.putExtra("test","https://www.google.com/search?q=pornhub"); startActivity(i); }); findViewById(R.id.btnParentDash).setOnClickListener(v->startActivity(new Intent(this,PinActivity.class))); } }
          EOF
          cat > app/src/main/java/com/safeguard/onehub/PinActivity.java <<'EOF'
          package com.safeguard.onehub; import androidx.appcompat.app.AppCompatActivity; import android.content.Intent; import android.content.SharedPreferences; import android.os.Bundle; import android.widget.EditText; import android.widget.Toast; public class PinActivity extends AppCompatActivity { protected void onCreate(Bundle b){ super.onCreate(b); setContentView(R.layout.activity_pin); SharedPreferences p=getSharedPreferences("safeguard",MODE_PRIVATE); EditText pin=findViewById(R.id.pinInput); findViewById(R.id.btnUnlock).setOnClickListener(v->{ if(pin.getText().toString().equals(p.getString("parent_pin","1234"))){ startActivity(new Intent(this,DashboardActivity.class)); finish(); } else Toast.makeText(this,"Wrong PIN! Try 1234",0).show(); }); findViewById(R.id.btnCancel).setOnClickListener(v->finish()); } }
          EOF
          cat > app/src/main/java/com/safeguard/onehub/DashboardActivity.java <<'EOF'
          package com.safeguard.onehub; import androidx.appcompat.app.AppCompatActivity; import android.content.Intent; import android.content.SharedPreferences; import android.os.Bundle; import android.widget.EditText; import android.widget.TextView; import android.widget.Toast; public class DashboardActivity extends AppCompatActivity { protected void onCreate(Bundle b){ super.onCreate(b); setContentView(R.layout.activity_dashboard); SharedPreferences p=getSharedPreferences("safeguard",MODE_PRIVATE); TextView h=findViewById(R.id.txtHistory); EditText n=findViewById(R.id.newPinInput); h.setText(p.getString("history","No blocked attempts yet - Safe")); findViewById(R.id.btnSavePin).setOnClickListener(v->{ String np=n.getText().toString(); if(np.length()>=4){ p.edit().putString("parent_pin",np).apply(); Toast.makeText(this,"Saved!",1).show(); n.setText(""); } }); findViewById(R.id.btnClear).setOnClickListener(v->{ p.edit().putString("history","No blocked attempts yet").apply(); h.setText("No blocked attempts yet"); }); findViewById(R.id.btnLock).setOnClickListener(v->{ startActivity(new Intent(this,MainActivity.class)); finish(); }); } }
          EOF
          cat > app/src/main/java/com/safeguard/onehub/BrowserActivity.java <<'EOF'
          package com.safeguard.onehub; import androidx.appcompat.app.AppCompatActivity; import android.content.SharedPreferences; import android.os.Bundle; import android.webkit.WebResourceRequest; import android.webkit.WebView; import android.webkit.WebViewClient; public class BrowserActivity extends AppCompatActivity { WebView wv; SharedPreferences prefs; protected void onCreate(Bundle b){ super.onCreate(b); setContentView(R.layout.activity_browser); prefs=getSharedPreferences("safeguard",MODE_PRIVATE); wv=findViewById(R.id.webview); wv.getSettings().setJavaScriptEnabled(true); wv.setWebViewClient(new WebViewClient(){ public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r){ String u=r.getUrl().toString().toLowerCase(); if(u.contains("pornhub")||u.contains("xvideos")||u.contains("xnxx")||u.contains("porn")||u.contains("xxx")||u.contains("onlyfans")||u.contains("underage")||u.contains("lolita")){ String old=prefs.getString("history",""); prefs.edit().putString("history","BLOCKED: "+r.getUrl().toString()+"\n"+old).apply(); v.loadData("<html><body style='text-align:center;padding:30px;background:#0F3D2E;color:white;'><h2 style='color:#FF6B6B;'>BLOCKED BY NDALA SAFE</h2><p>"+r.getUrl().toString()+"</p><button onclick='history.back()' style='background:#1E8C4A;color:white;padding:12px 24px;border:none;border-radius:8px;'>Go Back</button></body></html>","text/html","UTF-8"); return true; } return false; } }); String t=getIntent().getStringExtra("test"); if(t!=null) wv.loadUrl(t); else wv.loadUrl("https://www.google.com"); findViewById(R.id.btnBack).setOnClickListener(v->finish()); findViewById(R.id.btnHome).setOnClickListener(v->finish()); } public void onBackPressed(){ if(wv.canGoBack()) wv.goBack(); else super.onBackPressed(); } }
          EOF
      - uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.5
          arguments: :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: v94-FINAL-ORIGINAL-NoCrash-OPENS
          path: app/build/outputs/apk/debug/*.apk
