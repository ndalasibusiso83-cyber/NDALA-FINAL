name: Build NDALA APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Restore Gradle Wrapper
        run: |
          ls -la
          if [ ! -f "./gradlew" ]; then
            echo "gradlew missing - creating temporary wrapper"
            echo "rootProject.name = 'NDALA'" > settings.gradle
            echo "include ':app'" >> settings.gradle
            cat settings.gradle
            ls -la app/
          fi
          chmod +x ./gradlew 2>/dev/null || true
          chmod +x app/gradlew 2>/dev/null || true
      - name: Build with Gradle Action
        uses: gradle/gradle-build-action@v2
        with:
          arguments: |
            ${{ hashFiles('**/gradlew') != '' && './gradlew' || 'gradle' }} assembleDebug --stacktrace
          build-root-directory: .
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NDALA-SECURE-PIN-FINAL
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
            build/outputs/apk/debug/*.apk
