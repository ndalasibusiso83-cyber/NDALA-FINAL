name: Build SafeGuard GUARANTEED OPEN
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: BUILD GUARANTEED OPEN
        run: |
          rm -rf app/src .gradle app/build || true
          mkdir -p app/src/main/java/com/safeguard/onehub
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > settings.gradle <<'SET'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "SafeGuard-OPEN"; include ':app'
          SET

          cat > build.gradle <<'ROOT'
          plugins { id 'com.android.application' version '8.2.2' apply false }
          ROOT

          printf "org.gradle.jvmargs=-Xmx2048m\nandroid.useAndroidX=true\n" > gradle.properties

          cat > app/build.gradle <<'APP'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.safeguard.onehub'
              compileSdk 34
              defaultConfig {
                  applicationId "com.safeguard.onehub"
                  minSdk 24
                  targetSdk 34
                  versionCode 94
                  versionName "9.4-GUARANTEED-OPEN"
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          APP

          cat > app/src/main/res/values/strings.xml <<'STR'
          <resources><string name="app_name">SafeGuard One Hub</string></resources>
          STR

          cat > app/src/main/res/drawable/card_bg.xml <<'D1'
          <?xml version="1.0" encoding="utf-8"?><shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#FFFFFF"/><corners android:radius="16dp"/><stroke android:width="1dp" android:color="#E0E0E0"/></shape>
          D1
          cat > app/src/main/res/drawable/btn_green.xml <<'D2'
          <?xml version="1.0" encoding="utf-8"?><shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#0F3D2E"/><corners android:radius="12dp"/></shape>
          D2

          cat > app/src/main/AndroidManifest.xml <<'MAN'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="SafeGuard One Hub" android:theme="@android:style/Theme.Black.NoTitleBar">
              <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
              <activity android:name=".PinActivity" android:exported="false"/>
              <activity android:name=".DashboardActivity" android:exported="false"/>
              <activity android:name=".BrowserActivity" android:exported="false"/>
            </application>
          </manifest>
          MAN

          cat > app/src/main/res/layout/activity_main.xml <<'L1'
          <?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#F5F5F0" android:orientation="vertical" android:padding="16dp" android:gravity="center_horizontal"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="🛡️ SafeGuard One Hub" android:textColor="#0F3D2E" android:textSize="20sp" android:textStyle="bold" android:layout_marginTop="20dp"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Parental control dashboard - ORIGINAL" android:textColor="#666666" android:textSize="12sp" android:layout_marginBottom="20dp"/><Button android:id="@+id/btnSearch" android:layout_width="match_parent" android:layout_height="50dp" android:text="🔍 Safe Google Search" android:background="@drawable/btn_green" android:textColor="#FFFFFF" android:layout_marginBottom="10dp"/><Button android:id="@+id/btnTestBlock" android:layout_width="match_parent" android:layout_height="50dp" android:text="TEST BLOCK" android:background="#FFFFFF" android:textColor="#0F3D2E" android:layout_marginBottom="10dp"/><Button android:id="@+id/btnParentDash" android:layout_width="match_parent" android:layout_height="50dp" android:text="Parent Dashboard" android:background="@drawable/btn_green" android:textColor="#FFFFFF"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Created by Sibusiso D Ndala - NDALA Safeguard" android:textColor="#888888" android:textSize="10sp" android:layout_marginTop="30dp"/></LinearLayout>
          L1

          cat > app/src/main/res/layout/activity_pin.xml <<'L3'
          <?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#0F3D2E" android:orientation="vertical" android:padding="24dp" android:gravity="center_horizontal"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Parent PIN Required" android:textColor="#FFFFFF" android:textSize="18sp" android:textStyle="bold" android:layout_marginTop="60dp"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Kids cannot see PIN" android:textColor="#A8D5BA" android:textSize="11sp" android:layout_marginBottom="20dp"/><EditText android:id="@+id/pinInput" android:layout_width="match_parent" android:layout_height="48dp" android:background="#FFFFFF" android:hint="Enter PIN ••••" android:gravity="center" android:inputType="numberPassword"/><Button android:id="@+id/btnUnlock" android:layout_width="match_parent" android:layout_height="48dp" android:text="Unlock Dashboard" android:background="#1E8C4A" android:textColor="#FFFFFF" android:layout_marginTop="12dp"/><Button android:id="@+id/btnCancel" android:layout_width="match_parent" android:layout_height="44dp" android:text="Cancel" android:background="#1A4D3A" android:textColor="#FFFFFF" android:layout_marginTop="8dp"/></LinearLayout>
          L3

          cat > app/src/main/res/layout/activity_dashboard.xml <<'L4'
          <?xml version="1.0" encoding="utf-8"?><ScrollView xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#0F3D2E"><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="16dp"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Parent Dashboard • SECURED ✓" android:textColor="#4CAF50" android:textSize="16sp" android:textStyle="bold" android:layout_marginTop="12dp" android:layout_marginBottom="12dp"/><Button android:layout_width="match_parent" android:layout_height="60dp" android:text="Kids Profiles - Protected" android:background="#1A4D3A" android:textColor="#FFFFFF" android:layout_marginBottom="8dp"/><Button android:layout_width="match_parent" android:layout_height="60dp" android:text="Screen Time - 3h 24m" android:background="#1A4D3A" android:textColor="#FFFFFF" android:layout_marginBottom="8dp"/><Button android:layout_width="match_parent" android:layout_height="60dp" android:text="Content Filter - Active Safe" android:background="#1A4D3A" android:textColor="#FFFFFF" android:layout_marginBottom="8dp"/><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="🔑 Create Your Own PIN (Hidden)" android:textColor="#4CAF50" android:textSize="13sp" android:textStyle="bold" android:layout_marginTop="12dp" android:layout_marginBottom="8dp"/><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:background="#1A4D3A" android:orientation="vertical" android:padding="12dp"><EditText android:id="@+id/newPinInput" android:layout_width="match_parent" android:layout_height="48dp" android:background="#FFFFFF" android:hint="Enter NEW PIN" android:gravity="center" android:inputType="numberPassword"/><Button android:id="@+id/btnSavePin" android:layout_width="match_parent" android:layout_height="44dp" android:text="Save New PIN - Hidden from kids" android:background="#1E8C4A" android:textColor="#FFFFFF" android:layout_marginTop="8dp"/><TextView android:id="@+id/txtPinStatus" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Current PIN: •••• hidden" android:textColor="#A8D5BA" android:textSize="11sp" android:layout_marginTop="6dp"/></LinearLayout><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="👀 What Kids Tried Accessing" android:textColor="#FF6B6B" android:textSize="13sp" android:textStyle="bold" android:layout_marginTop="16dp" android:layout_marginBottom="8dp"/><TextView android:id="@+id/txtHistory" android:layout_width="match_parent" android:layout_height="wrap_content" android:background="#1A4D3A" android:padding="12dp" android:textColor="#FFFFFF" android:textSize="11sp" android:text="No blocked attempts yet - Safe ✓"/><Button android:id="@+id/btnClear" android:layout_width="match_parent" android:layout_height="44dp" android:text="Clear History" android:background="#333333" android:textColor="#FFFFFF" android:layout_marginTop="8dp"/><Button android:id="@+id/btnLock" android:layout_width="match_parent" android:layout_height="50dp" android:text="Lock Dashboard" android:background="#1E8C4A" android:textColor="#FFFFFF" android:layout_marginTop="16dp" android:layout_marginBottom="20dp"/></LinearLayout></ScrollView>
          L4

          cat > app/src/main/res/layout/activity_browser.xml <<'L2'
          <?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:background="#FFFFFF"><LinearLayout android:layout_width="match_parent" android:layout_height="50dp" android:background="#0F3D2E" android:gravity="center_vertical" android:orientation="horizontal" android:padding="8dp"><Button android:id="@+id/btnBack" android:layout_width="60dp" android:layout_height="36dp" android:text="‹ Back" android:background="#1E8C4A" android:textColor="#FFFFFF"/><TextView android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content" android:text="Safe Search" android:textColor="#FFFFFF" android:gravity="center" android:textStyle="bold"/><Button android:id="@+id/btnHome" android:layout_width="60dp" android:layout_height="36dp" android:text="Home" android:background="#FFFFFF" android:textColor="#0F3D2E"/></LinearLayout><WebView android:id="@+id/webview" android:layout_width="match_parent" android:layout_height="match_parent"/></LinearLayout>
          L2

          cat > app/src/main/java/com/safeguard/onehub/MainActivity.java <<'J1'
          package com.safeguard.onehub; import android.app.Activity; import android.content.Intent; import android.os.Bundle;
          public class MainActivity extends Activity { protected void onCreate(Bundle b){ super.onCreate(b); setContentView(R.layout.activity_main); findViewById(R.id.btnSearch).setOnClickListener(v->startActivity(new Intent(this,BrowserActivity.class))); findViewById(R.id.btnTestBlock).setOnClickListener(v->{ Intent i=new Intent(this,BrowserActivity.class); i.putExtra("test","https://www.google.com/search?q=pornhub"); startActivity(i); }); findViewById(R.id.btnParentDash).setOnClickListener(v->startActivity(new Intent(this,PinActivity.class))); } }
          J1
          cat > app/src/main/java/com/safeguard/onehub/PinActivity.java <<'J2'
          package com.safeguard.onehub; import android.app.Activity; import android.content.Intent; import android.content.SharedPreferences; import android.os.Bundle; import android.widget.EditText; import android.widget.Toast;
          public class PinActivity extends Activity { protected void onCreate(Bundle b){ super.onCreate(b); setContentView(R.layout.activity_pin); SharedPreferences p=getSharedPreferences("safeguard",MODE_PRIVATE); EditText pin=findViewById(R.id.pinInput); findViewById(R.id.btnUnlock).setOnClickListener(v->{ String saved=p.getString("parent_pin","1234"); if(pin.getText().toString().equals(saved)){ startActivity(new Intent(this,DashboardActivity.class)); finish(); } else Toast.makeText(this,"Wrong PIN! First 1234",0).show(); }); findViewById(R.id.btnCancel).setOnClickListener(v->finish()); } }
          J2
          cat > app/src/main/java/com/safeguard/onehub/DashboardActivity.java <<'J3'
          package com.safeguard.onehub; import android.app.Activity; import android.content.Intent; import android.content.SharedPreferences; import android.os.Bundle; import android.widget.EditText; import android.widget.TextView; import android.widget.Toast;
          public class DashboardActivity extends Activity { protected void onCreate(Bundle b){ super.onCreate(b); setContentView(R.layout.activity_dashboard); SharedPreferences p=getSharedPreferences("safeguard",MODE_PRIVATE); TextView h=findViewById(R.id.txtHistory); TextView s=findViewById(R.id.txtPinStatus); EditText n=findViewById(R.id.newPinInput); h.setText(p.getString("history","No blocked attempts yet - Safe")); s.setText("Current PIN: •••• hidden"); findViewById(R.id.btnSavePin).setOnClickListener(v->{ String np=n.getText().toString(); if(np.length()>=4){ p.edit().putString("parent_pin",np).apply(); Toast.makeText(this,"PIN Saved Hidden!",1).show(); n.setText(""); s.setText("New PIN: •••• saved"); } }); findViewById(R.id.btnClear).setOnClickListener(v->{ p.edit().putString("history","No blocked attempts yet - Safe").apply(); h.setText("No blocked attempts yet - Safe"); }); findViewById(R.id.btnLock).setOnClickListener(v->{ startActivity(new Intent(this,MainActivity.class)); finish(); }); } }
          J3
          cat > app/src/main/java/com/safeguard/onehub/BrowserActivity.java <<'J4'
          package com.safeguard.onehub; import android.app.Activity; import android.content.SharedPreferences; import android.os.Bundle; import android.webkit.WebView; import android.webkit.WebViewClient; import android.webkit.WebResourceRequest;
          public class BrowserActivity extends Activity { WebView wv; SharedPreferences prefs; String[] blocked={"pornhub","xvideos","xnxx","porn","xxx","onlyfans"}; protected void onCreate(Bundle b){ super.onCreate(b); setContentView(R.layout.activity_browser); prefs=getSharedPreferences("safeguard",MODE_PRIVATE); wv=findViewById(R.id.webview); wv.getSettings().setJavaScriptEnabled(true); wv.setWebViewClient(new WebViewClient(){ public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r){ String u=r.getUrl().toString().toLowerCase(); for(String s:blocked){ if(u.contains(s)){ block(u); return true; } } return false; } }); String t=getIntent().getStringExtra("test"); if(t!=null) wv.loadUrl(t); else wv.loadUrl("https://www.google.com"); findViewById(R.id.btnBack).setOnClickListener(v->finish()); findViewById(R.id.btnHome).setOnClickListener(v->finish()); } void block(String url){ String h=prefs.getString("history",""); if(h.contains("No blocked")) h=""; prefs.edit().putString("history","🚫 Tried: "+url+"\n"+h).apply(); String html="<html><body style='text-align:center;padding:20px;background:#0F3D2E;color:white;'><h2 style='color:#FF6B6B;'>🚫 BLOCKED BY NDALA</h2><p>"+url+" blocked</p><button onclick='history.back()' style='background:#1E8C4A;color:white;padding:12px 24px;border:none;border-radius:8px;'>Go Back</button></body></html>"; wv.loadData(html,"text/html","UTF-8"); } public void onBackPressed(){ if(wv.canGoBack()) wv.goBack(); else super.onBackPressed(); } }
          J4

      - uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.5
          arguments: :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SafeGuard-OPEN-v94
          path: app/build/outputs/apk/debug/*.apk
