roid:layout_width="match_parent" android:layout_height="wrap_content" android:background="#1A4D3A" android:padding="12dp" android:textColor="#FFFFFF" android:textSize="11sp" android:text="No searches yet"/><Button android:id="@+id/btnClear" android:layout_width="match_parent" android:layout_height="44dp" android:text="Clear History" android:background="#333333" android:textColor="#FFFFFF" android:layout_marginTop="8dp"/><Button android:id="@+id/btnLock" android:layout_width="match_parent" android:layout_height="50dp" android:text="Lock Dashboard" android:background="#1E8C4A" android:textColor="#FFFFFF" android:layout_marginTop="16dp"/></LinearLayout></ScrollView>
