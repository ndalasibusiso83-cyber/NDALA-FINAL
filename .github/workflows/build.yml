          package com.safeguard.onehub; import android.app.Activity; import android.content.Intent; import android.content.SharedPreferences; import android.os.Bundle; import android.widget.EditText; import android.widget.Toast;
          public class PinActivity extends Activity { protected void onCreate(Bundle b){ super.onCreate(b); setContentView(R.layout.activity_pin); SharedPreferences p=getSharedPreferences("safeguard",0); EditText pin=findViewById(R.id.pinInput); findViewById(R.id.btnUnlock).setOnClickListener(v->{ if(pin.getText().toString().equals(p.getString("parent_pin","1234"))){ startActivity(new Intent(this, DashboardActivity.class)); finish(); } else Toast.makeText(this,"Wrong PIN first 1234",0).show(); }); findViewById(R.id.btnCancel).setOnClickListener(v->finish()); } }
