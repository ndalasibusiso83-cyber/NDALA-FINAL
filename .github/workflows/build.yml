          package com.safeguard.onehub; import android.app.Activity; import android.content.Intent; import android.os.Bundle;
          public class MainActivity extends Activity { protected void onCreate(Bundle b){ super.onCreate(b); setContentView(R.layout.activity_main); findViewById(R.id.btnSearch).setOnClickListener(v->startActivity(new Intent(this, BrowserActivity.class))); findViewById(R.id.btnTestBlock).setOnClickListener(v->{ Intent i=new Intent(this, BrowserActivity.class); i.putExtra("url","https://www.google.com/search?q=pornhub"); startActivity(i); }); findViewById(R.id.btnParentDash).setOnClickListener(v->startActivity(new Intent(this, PinActivity.class))); } }
