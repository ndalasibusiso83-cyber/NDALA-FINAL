name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build NDALA PIN GREEN
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          rm -rf app build.gradle settings.gradle gradle gradlew* local.properties
          mkdir -p app/src/main/java/com/safeguard/onehub
          mkdir -p app/src/main/res/values app/src/main/res/layout app/src/main/res/drawable app/src/main/assets
          echo 'include ":app"' > settings.gradle
          cat > build.gradle <<'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath "com.android.tools.build:gradle:8.2.2" }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > app/build.gradle <<'EOF'
          apply plugin: "com.android.application"
          android {
            namespace "com.safeguard.onehub"
            compileSdk 34
            defaultConfig {
              applicationId "com.safeguard.onehub"
              minSdk 24
              targetSdk 34
              versionCode 23
              versionName "6.0 PIN FIXED"
            }
          }
