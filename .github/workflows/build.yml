name: Build NDALA APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: FIX PACKAGE NAME - final is Java keyword
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "NDALA-FINAL"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF
          printf "org.gradle.jvmargs=-Xmx2048m\nandroid.useAndroidX=true\n" > gradle.properties
          
          # FIX: com.ndala.secure is valid - com.ndala.final is NOT valid
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.ndala.secure'
              compileSdk 34
              defaultConfig {
                  applicationId "com.ndala.secure"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF
          
          rm -rf app/src/main/res
          mkdir -p app/src/main/res/layout
          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:background="#000000">
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="NDALA SECURE PIN - BUILD SUCCESS!"
                  android:textColor="#FFFFFF"
                  android:textSize="22sp"
                  android:padding="24dp" />
          </LinearLayout>
          EOF
          
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="NDALA SECURE" android:theme="@android:style/Theme.Black.NoTitleBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          rm -rf app/src/main/java/com
          mkdir -p app/src/main/java/com/ndala/secure
          cat > app/src/main/java/com/ndala/secure/MainActivity.java <<'EOF'
          package com.ndala.secure;
          import android.app.Activity;
          import android.os.Bundle;
          public class MainActivity extends Activity {
              protected void onCreate(Bundle b){
                  super.onCreate(b);
                  setContentView(R.layout.activity_main);
              }
          }
          EOF
      - name: Build APK
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.5
          arguments: :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NDALA-SECURE-PIN-APK
          path: app/build/outputs/apk/debug/*.apk
