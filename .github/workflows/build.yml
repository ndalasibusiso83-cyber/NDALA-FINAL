name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android
        uses: android-actions/setup-android@v3
      - name: Build NDALA Real APK
        run: |
          rm -rf app build.gradle settings.gradle gradle gradlew*
          mkdir -p app/src/main/java/com/safeguard/onehub
          echo 'include ":app"' > settings.gradle
          cat > build.gradle <<'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath "com.android.tools.build:gradle:8.2.2" }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace "com.safeguard.onehub"
            compileSdk 34
            defaultConfig {
              applicationId "com.safeguard.onehub"
              minSdk 24
              targetSdk 34
              versionCode 6
              versionName "1.0"
            }
            buildTypes { debug { minifyEnabled false } }
          }
          dependencies {}
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="NDALA" android:theme="@android:style/Theme.NoTitleBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/safeguard/onehub/MainActivity.java <<'EOF'
          package com.safeguard.onehub;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.*;
          public class MainActivity extends Activity{
            WebView w;
            protected void onCreate(Bundle b){
              super.onCreate(b);
              w=new WebView(this);
              setContentView(w);
              w.getSettings().setJavaScriptEnabled(true);
              w.setWebViewClient(new WebViewClient(){
                public boolean shouldOverrideUrlLoading(WebView v,WebResourceRequest r){
                  String url=r.getUrl().toString().toLowerCase();
                  if(url.contains("pornhub")||url.contains("xvideos")||url.contains("xnxx")||url.contains("xhamster")){
                    v.loadData("<html><body><h1>Blocked by NDALA</h1><p>This site is blocked.</p></body></html>","text/html","UTF-8");
                    return true;
                  }
                  return false;
                }
              });
              w.loadUrl("https://www.google.com");
            }
          }
          EOF
          chmod +x gradlew 2>/dev/null || true
          if [! -f gradlew ]; then
            wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
            unzip -q gradle-8.7-bin.zip
           ./gradle-8.7/bin/gradle wrapper --gradle-version 8.7
            chmod +x gradlew
          fi
          ./gradlew app:assembleDebug --stacktrace
          echo "=== APK SIZE ==="
          ls -lh app/build/outputs/apk/debug/ -R
      - name: Upload REAL APK
        uses: actions/upload-artifact@v4
        with:
          name: NDALA-APK-REAL
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
