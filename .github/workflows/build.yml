name: Build NDALA APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Find and build
        run: |
          echo "=== Checking files ==="
          ls -la
          ls -la app/ || true
          find . -name "gradlew" -type f
          chmod +x ./gradlew || true
          chmod +x gradlew || true
          chmod +x app/gradlew || true
          if [ -f ./gradlew ]; then ./gradlew assembleDebug; elif [ -f app/gradlew ]; then cd app && ./gradlew assembleDebug; else gradle assembleDebug; fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NDALA-SECURE-PIN-FINAL
          path: |
            app/build/outputs/apk/debug/*.apk
            app/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
