name: Build SafeGuard One Hub GREEN
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: SUPER CLEAN BUILD
        run: |
          find . -name "*.java" -type f -delete || true
          rm -rf app/src NDALA-FINAL .gradle app/build || true
          mkdir -p app/src/main/java/com/safeguard/onehub
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "SafeGuard-GREEN"; include ':app'
          EOF
          echo "plugins { id 'com.android.application' version '8.2.2' apply false }" > build.gradle
          printf "org.gradle.jvmargs=-Xmx2048m\nandroid.useAndroidX=true\n" > gradle.properties

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.safeguard.onehub'
            compileSdk 34
            defaultConfig {
              applicationId "com.safeguard.onehub"
              minSdk 24
              targetSdk 34
              versionCode 85
              versionName "8.5-SafeGuard-One-Hub-GREEN"
            }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
            <string name="app_name">SafeGuard One Hub</string>
          </resources>
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="SafeGuard One Hub" android:theme="@android:style/Theme.Black.NoTitleBar">
              <activity android:name=".MainActivity" android:exported="true" android:label="SafeGuard One Hub">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
              <activity android:name=".DashboardActivity" android:exported="false" android:label="Parent Dashboard"/>
            </application>
          </manifest>
          EOF
          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#0F3D2E" android:orientation="vertical" android:padding="24dp" android:gravity="center_horizontal"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="SafeGuard One Hub" android:textColor="#FFFFFF" android:textSize="22sp" android:textStyle="bold" android:layout_marginTop="30dp"/><TextView android:id="@+id/titleText" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Parent PIN Required" android:textColor="#FFFFFF" android:textSize="20sp" android:textStyle="bold" android:layout_marginTop="20dp"/><TextView android:id="@+id/hintText" android:layout_width="match_parent" android:layout_height="50dp" android:background="#FFFFFF" android:text="Enter PIN ••••" android:gravity="center" android:layout_marginTop="20dp"/><Button android:id="@+id/btnUnlock" android:layout_width="match_parent" android:layout_height="50dp" android:text="Unlock Dashboard - See All Features" android:background="#1E8C4A" android:textColor="#FFFFFF" android:layout_marginTop="30dp"/></LinearLayout>
          EOF
          cat > app/src/main/res/layout/activity_dashboard.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?><ScrollView xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#0F3D2E"><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="16dp"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Parent Dashboard • SECURED ✓" android:textColor="#4CAF50" android:textSize="16sp" android:textStyle="bold" android:layout_marginTop="20dp"/><Button android:layout_width="match_parent" android:layout_height="70dp" android:text="Kids Profiles - Thabo(9) Amahle(12)" android:background="#1A4D3A" android:textColor="#FFFFFF" android:layout_marginTop="20dp"/><Button android:layout_width="match_parent" android:layout_height="70dp" android:text="Screen Time - 3h 24m today" android:background="#1A4D3A" android:textColor="#FFFFFF" android:layout_marginTop="10dp"/><Button android:layout_width="match_parent" android:layout_height="70dp" android:text="Content Filter - Active Safe 124 blocked" android:background="#1A4D3A" android:textColor="#FFFFFF" android:layout_marginTop="10dp"/><Button android:layout_width="match_parent" android:layout_height="70dp" android:text="Location - Home Safe" android:background="#1A4D3A" android:textColor="#FFFFFF" android:layout_marginTop="10dp"/><Button android:layout_width="match_parent" android:layout_height="70dp" android:text="Reports - Weekly Dr Mpho" android:background="#1A4D3A" android:textColor="#FFFFFF" android:layout_marginTop="10dp"/><Button android:layout_width="match_parent" android:layout_height="70dp" android:text="App Controls &amp; Limits" android:background="#1A4D3A" android:textColor="#FFFFFF" android:layout_marginTop="10dp"/><Button android:id="@+id/btnLock" android:layout_width="match_parent" android:layout_height="50dp" android:text="Lock" android:layout_marginTop="20dp"/></LinearLayout></ScrollView>
          EOF
          cat > app/src/main/java/com/safeguard/onehub/MainActivity.java <<'EOF'
          package com.safeguard.onehub; import android.app.Activity; import android.content.Intent; import android.os.Bundle;
          public class MainActivity extends Activity { protected void onCreate(Bundle b){ super.onCreate(b); setContentView(R.layout.activity_main); findViewById(R.id.btnUnlock).setOnClickListener(v->{ startActivity(new Intent(this,DashboardActivity.class)); finish(); }); } }
          EOF
          cat > app/src/main/java/com/safeguard/onehub/DashboardActivity.java <<'EOF'
          package com.safeguard.onehub; import android.app.Activity; import android.content.Intent; import android.os.Bundle;
          public class DashboardActivity extends Activity { protected void onCreate(Bundle b){ super.onCreate(b); setContentView(R.layout.activity_dashboard); findViewById(R.id.btnLock).setOnClickListener(v->{ startActivity(new Intent(this,MainActivity.class)); finish(); }); } }
          EOF

      - uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.5
          arguments: :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SafeGuard-One-Hub-GREEN-v85
          path: app/build/outputs/apk/debug/*.apk
