          package com.safeguard.onehub; import android.app.Activity; import android.content.Intent; import android.content.SharedPreferences; import android.os.Bundle; import android.widget.EditText; import android.widget.TextView; import android.widget.Toast;
          public class DashboardActivity extends Activity { protected void onCreate(Bundle b){ super.onCreate(b); setContentView(R.layout.activity_dashboard); SharedPreferences p=getSharedPreferences("safeguard",0); TextView h=findViewById(R.id.txtHistory); EditText n=findViewById(R.id.newPinInput); h.setText(p.getString("history","No searches yet")); findViewById(R.id.btnSavePin).setOnClickListener(v->{ String np=n.getText().toString(); if(np.length()>=4){ p.edit().putString("parent_pin",np).apply(); Toast.makeText(this,"PIN Saved!",1).show(); n.setText(""); } }); findViewById(R.id.btnClear).setOnClickListener(v->{ p.edit().putString("history","No searches yet").apply(); h.setText("No searches yet"); }); findViewById(R.id.btnLock).setOnClickListener(v->{ startActivity(new Intent(this, MainActivity.class)); finish(); }); } }
